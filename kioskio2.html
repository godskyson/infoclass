<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>키오스크 마을 3</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{
  --ink:#1F2330; --ink2:#454C5E; --muted:#6B7385; --line:rgba(30,40,80,.10);
  --surface:rgba(255,255,255,.92); --surface-solid:#fff; --surface-2:#F2F4FA;
  --blue:#4285F4; --red:#EA4335; --yellow:#FBBC04; --green:#34A853; --purple:#9B72CB; --pink:#D96570;
  --g-brand:linear-gradient(120deg,#4285F4 0%,#9B72CB 55%,#D96570 100%);
  --g-pro:linear-gradient(135deg,#FFA25F 0%,#FF6B4A 50%,#EA4335 100%);
  --g-con:linear-gradient(135deg,#5AB0FF 0%,#1A73E8 50%,#12A4C8 100%);
  --g-both:linear-gradient(135deg,#B892FF 0%,#9B72CB 50%,#D96570 100%);
  --g-ok:linear-gradient(135deg,#6BE39A 0%,#34A853 100%);
  --g-gold:linear-gradient(135deg,#FFD66B 0%,#FBBC04 50%,#FF9F1C 100%);
  --g-ink:linear-gradient(135deg,#2E3446 0%,#1B1F2B 100%);
  --pro:#E4502F; --pro-soft:#FFEEE7; --con:#1A6FE0; --con-soft:#E7F0FF; --both:#8558CC; --both-soft:#F3ECFF; --ok:#1E9E4A; --ok-soft:#E5F7EC;
  --sh-1:0 1px 2px rgba(20,30,70,.08),0 3px 10px rgba(20,30,70,.08);
  --sh-2:0 4px 14px rgba(20,30,70,.10),0 14px 34px rgba(20,30,70,.14);
  --sh-3:0 12px 30px rgba(20,30,70,.18),0 34px 70px rgba(20,30,70,.24);
  --ease-out:cubic-bezier(0.23,1,0.32,1); --ease-in-out:cubic-bezier(0.77,0,0.175,1);
  --display:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --body:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
html,body{height:100%}
body{margin:0;background:#EEF1F8;overflow:hidden;color:var(--ink);font-family:var(--body)}
#root{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(900px 600px at 15% 10%,#DCE8FF 0%,rgba(220,232,255,0) 60%),radial-gradient(900px 600px at 90% 95%,#FDE3EA 0%,rgba(253,227,234,0) 60%),#EEF1F8}
#stage{width:960px;height:540px;position:relative;overflow:hidden;background:#F4F6FB;transform-origin:center center;user-select:none;font-size:16px;line-height:1.5;border-radius:26px;box-shadow:var(--sh-3)}
#stage *{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent}
button:focus-visible,textarea:focus-visible{outline:3px solid rgba(66,133,244,.55);outline-offset:2px}
.layer{position:absolute;inset:0}
.gtext{background:var(--g-brand);-webkit-background-clip:text;background-clip:text;color:transparent}

/* ---------- background ---------- */
.bgl{position:absolute;inset:0;overflow:hidden}
.bgl img{width:100%;height:100%;object-fit:cover;display:block}
.bgl.fadein{animation:fade .45s var(--ease-out) backwards}
.bgl .dim{position:absolute;inset:0;background:linear-gradient(to top,rgba(18,22,40,.50) 0%,rgba(18,22,40,.05) 50%,rgba(18,22,40,.18) 100%)}
.bgl.blur img{filter:blur(8px) saturate(1.1);transform:scale(1.08)}
.bgl .wash{position:absolute;inset:0;background:linear-gradient(150deg,rgba(234,242,255,.90) 0%,rgba(243,236,255,.86) 50%,rgba(255,237,242,.90) 100%)}
.blobs i{position:absolute;display:block;width:560px;height:560px;border-radius:50%;will-change:transform}
.blobs .b1{left:-180px;top:-220px;background:radial-gradient(circle,rgba(66,133,244,.34) 0%,rgba(66,133,244,0) 65%);animation:drift1 16s var(--ease-in-out) infinite alternate}
.blobs .b2{right:-200px;bottom:-260px;background:radial-gradient(circle,rgba(217,101,112,.30) 0%,rgba(217,101,112,0) 65%);animation:drift2 19s var(--ease-in-out) infinite alternate}
.blobs .b3{right:120px;top:-260px;background:radial-gradient(circle,rgba(251,188,4,.22) 0%,rgba(251,188,4,0) 62%);animation:drift3 22s var(--ease-in-out) infinite alternate}
@keyframes drift1{to{transform:translate(140px,90px)}}
@keyframes drift2{to{transform:translate(-160px,-70px)}}
@keyframes drift3{to{transform:translate(-120px,120px)}}

#content{pointer-events:none}
#content > *{pointer-events:auto}

/* ---------- motion primitives ---------- */
@keyframes fade{from{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.97)}}
@keyframes pop{from{opacity:0;transform:scale(.94)}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
@keyframes sheen{0%,55%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
@keyframes bob{50%{transform:translateY(-5px)}}
@keyframes nudge{50%{transform:translateY(3px)}}
@keyframes draw{to{stroke-dashoffset:0}}
.enter{animation:rise .34s var(--ease-out) backwards;animation-delay:calc(var(--i,0) * 45ms)}
.ripple{position:absolute;border-radius:50%;pointer-events:none;z-index:4;background:radial-gradient(circle,rgba(66,133,244,.30) 0%,rgba(155,114,203,.18) 45%,rgba(155,114,203,0) 70%);transform:scale(.15);animation:ripple .55s var(--ease-out) forwards}
@keyframes ripple{to{transform:scale(1);opacity:0}}
.start-btn .ripple,.hud-btn .ripple,.gbtn:not(.ghost) .ripple,.choose button .ripple,.mi.exp .ripple,.stance button.on .ripple,.foot.dark .ripple,.loc .ripple{background:radial-gradient(circle,rgba(255,255,255,.6) 0%,rgba(255,255,255,0) 70%)}

/* press feedback: fast, transform only */
.mi,.loc,.start-btn,.hud-btn,.hud-ic,.gbtn,.agree,.choose button,.pick,.stance button,.seg button,.kiosk.easy .kb,.foot,.chip-btn{position:relative;overflow:hidden;transition:transform .14s var(--ease-out),box-shadow .2s var(--ease-out),background-color .2s ease,opacity .2s ease,filter .2s ease}
.start-btn:active,.hud-btn:active,.hud-ic:active,.gbtn:active,.agree:active,.choose button:active,.stance button:active,.seg button:active,.kiosk.easy .kb:active,.foot:active,.chip-btn:active{transform:scale(.95)}
.mi:active{transform:scale(.97)}
.loc:active{transform:scale(.97)}
.pick:active{transform:scale(.985)}

/* ---------- HUD ---------- */
#hud{pointer-events:none;padding:14px 18px;display:flex;justify-content:space-between;align-items:flex-start;z-index:1}
#hud > *{pointer-events:auto}
#hud:empty{display:none}
.hud-loc{font-family:var(--display);font-size:17px;background:var(--surface);padding:7px 16px 7px 12px;border-radius:999px;box-shadow:var(--sh-1);display:flex;align-items:center;gap:8px;backdrop-filter:blur(8px)}
.hud-loc .pin{width:12px;height:12px;border-radius:50%;background:var(--g-brand);box-shadow:0 0 0 4px rgba(66,133,244,.15)}
.hud-right{display:flex;gap:8px;align-items:center}
.hud-cards{font-family:var(--display);font-size:17px;background:var(--surface);padding:4px 14px 4px 5px;border-radius:999px;box-shadow:var(--sh-1);display:flex;gap:6px;align-items:center;font-variant-numeric:tabular-nums;backdrop-filter:blur(8px)}
.hud-cards b{font-weight:400}
.hud-cards small{font-size:13px;color:var(--muted)}
.ring{width:32px;height:32px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:4}
.ring .trk{stroke:#E6E9F2}
.ring .val{stroke:url(#rg);stroke-linecap:round;transition:stroke-dashoffset .7s var(--ease-out)}
.hud-btn{font-family:var(--display);font-size:16px;background:var(--g-brand);color:#fff;padding:8px 18px;border-radius:999px;box-shadow:0 6px 16px rgba(123,112,220,.35)}
.hud-ic{width:36px;height:36px;border-radius:50%;background:var(--surface);box-shadow:var(--sh-1);font-size:16px;display:grid;place-items:center}
.hud-timer{font-family:var(--display);font-size:24px;background:var(--g-ink);color:#fff;padding:3px 18px;border-radius:999px;font-variant-numeric:tabular-nums;box-shadow:var(--sh-1)}
.hud-timer.hurry{background:var(--g-pro);animation:tick .9s var(--ease-out)}
@keyframes tick{0%{transform:scale(1.14)}100%{transform:scale(1)}}
.plus1{position:absolute;font-family:var(--display);font-size:18px;color:#fff;background:var(--g-ok);padding:2px 10px;border-radius:999px;box-shadow:var(--sh-1);pointer-events:none}

/* ---------- dialogue ---------- */
#dlg{top:auto;bottom:0;padding:0 24px 20px}
#dlg:empty{display:none}
.dbox{position:relative;background:var(--surface);border-radius:28px;min-height:134px;padding:24px 156px 22px 28px;cursor:pointer;box-shadow:var(--sh-2);backdrop-filter:blur(10px)}
.dbox::before{content:'';position:absolute;inset:0;border-radius:28px;padding:2px;background:var(--g-brand);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:.55;pointer-events:none}
.dbox.enter{animation:rise .26s var(--ease-out) backwards}
.dbox .name{position:absolute;top:-17px;left:22px;font-family:var(--display);font-size:18px;background:var(--g-brand);color:#fff;padding:5px 18px;border-radius:999px;box-shadow:0 6px 14px rgba(123,112,220,.35)}
.dbox .name.me{background:var(--g-ink);box-shadow:0 6px 14px rgba(30,35,50,.3)}
.dbox .name.sys{background:var(--g-gold);color:#3A2600}
.dbox .name.pop,.dbox .face.pop{animation:pop .24s var(--ease-out) backwards}
.dbox .dtext{font-size:18.5px;line-height:1.7;min-height:3.3em;color:var(--ink)}
.dbox .face{position:absolute;right:22px;top:-46px;width:118px;height:118px;border-radius:50%;padding:4px;background:var(--g-brand);box-shadow:var(--sh-2)}
.dbox .face img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;border:3px solid #fff}
.dbox .next{position:absolute;right:22px;bottom:12px;font-family:var(--display);font-size:13px;color:#fff;background:var(--g-brand);padding:2px 10px;border-radius:999px;animation:nudge 1.1s var(--ease-in-out) infinite}

/* ---------- menu ---------- */
#menu{display:flex;align-items:center;justify-content:center;pointer-events:none}
#menu:empty{display:none}
.mlist{pointer-events:auto;display:flex;flex-direction:column;gap:8px;width:580px;max-height:390px}
.mlist.bottom{position:absolute;bottom:160px}
.mtitle{align-self:center;font-family:var(--display);font-size:15px;color:var(--ink2);background:var(--surface);padding:4px 16px;border-radius:999px;box-shadow:var(--sh-1);margin-bottom:2px}
.mi{background:var(--surface);border-radius:20px;padding:13px 20px 13px 18px;text-align:left;font-size:16.5px;font-weight:500;display:flex;gap:12px;align-items:center;box-shadow:var(--sh-1);backdrop-filter:blur(8px)}
.mi::before{content:'';width:10px;height:10px;border-radius:50%;background:var(--g-brand);flex-shrink:0;transition:transform .2s var(--ease-out)}
.mi.asked{color:var(--muted)}
.mi.asked::before{background:#C9CFDC}
.mi.asked::after{content:'✓';margin-left:auto;width:24px;height:24px;border-radius:50%;background:var(--g-ok);color:#fff;font-size:13px;display:grid;place-items:center;flex-shrink:0}
.mi.exp{background:var(--g-brand);color:#fff;box-shadow:0 8px 22px rgba(123,112,220,.40)}
.mi.exp::before{background:#fff}
.mi.exp::after{content:'';position:absolute;inset:0;background:linear-gradient(100deg,rgba(255,255,255,0) 30%,rgba(255,255,255,.45) 50%,rgba(255,255,255,0) 70%);animation:sheen 3s var(--ease-in-out) infinite;pointer-events:none}
.mi.sub{font-size:15px;color:var(--ink2);background:rgba(255,255,255,.72)}
.mi.sub::before{background:#AEB5C4}
.mi[disabled]{opacity:.45;cursor:not-allowed}

/* ---------- popup ---------- */
#popup{display:grid;place-items:center;background:rgba(24,28,48,.40);backdrop-filter:blur(6px);animation:fade .22s var(--ease-out);transition:background-color .3s var(--ease-out),backdrop-filter .3s var(--ease-out)}
#popup:empty{display:none}
#popup.out{background:rgba(24,28,48,0);backdrop-filter:blur(0)}
.leave{opacity:0;transform:scale(.97);transition:opacity .16s var(--ease-out),transform .16s var(--ease-out)}
.cardpop{width:430px;background:#fff;border-radius:28px;box-shadow:var(--sh-3);overflow:hidden;position:relative}
.cardpop.enter{animation:card-in .5s var(--ease-out) backwards}
@keyframes card-in{from{opacity:0;transform:perspective(900px) rotateY(-70deg) scale(.95)}}
.cardpop.shake{animation:shake .4s var(--ease-out)}
.cardpop.reveal{animation:reveal .36s var(--ease-out)}
@keyframes reveal{0%{transform:scale(.96)}55%{transform:scale(1.025)}100%{transform:scale(1)}}
.cardpop .band{padding:12px 22px;font-family:var(--display);font-size:16px;display:flex;justify-content:space-between;color:#fff;background:var(--g-brand);position:relative;overflow:hidden}
.cardpop.pro .band{background:var(--g-pro)}
.cardpop.con .band{background:var(--g-con)}
.cardpop.both .band{background:var(--g-both)}
.cardpop.reveal .band::after{content:'';position:absolute;inset:0;background:linear-gradient(100deg,rgba(255,255,255,0) 30%,rgba(255,255,255,.55) 50%,rgba(255,255,255,0) 70%);animation:sheen .9s var(--ease-out) .1s backwards;transform:translateX(120%)}
.cardpop .body{padding:18px 22px 14px}
.cardpop .got{font-family:var(--display);font-size:14px;display:inline-block}
.cardpop h3{font-family:var(--display);font-weight:400;font-size:26px;margin:4px 0 8px;line-height:1.25;color:var(--ink)}
.cardpop p{margin:0;font-size:14.5px;line-height:1.7;color:var(--ink2)}
.cardpop .who{display:inline-block;font-size:12px;color:var(--muted);margin-top:10px;background:var(--surface-2);padding:3px 10px;border-radius:999px}
.cardpop .ask{padding:0 22px 10px;font-size:13.5px;color:var(--muted);line-height:1.6}
.cardpop .ask b{color:var(--ink);font-weight:500}
.cardpop .choose{display:flex;gap:10px;padding:0 18px 16px}
.cardpop .choose button{flex:1;padding:12px;font-family:var(--display);font-size:19px;color:#fff;border-radius:999px}
.cardpop .choose .pb{background:var(--g-pro);box-shadow:0 8px 18px rgba(234,67,53,.32)}
.cardpop .choose .cb{background:var(--g-con);box-shadow:0 8px 18px rgba(26,115,232,.32)}
.cardpop .hint{margin:0 18px 16px;background:var(--pro-soft);color:#A8321A;border-radius:18px;padding:10px 16px;font-size:13.5px;line-height:1.6;animation:rise .26s var(--ease-out) backwards;transition:opacity .2s var(--ease-out),transform .2s var(--ease-out)}
.cardpop .hint b{font-weight:700}
.cardpop .hint.bye{opacity:0;transform:translateY(-4px)}
.cardpop .note{margin:0 18px 12px;background:var(--both-soft);color:var(--both);border-radius:16px;padding:9px 14px;font-size:13px;line-height:1.6}
.foot{display:block;margin:0 18px 16px;width:calc(100% - 36px);padding:12px;border-radius:999px;background:var(--surface-2);text-align:center;font-family:var(--display);font-size:17px;color:var(--ink);cursor:pointer}
.foot.dark{background:var(--g-ink);color:#fff;box-shadow:0 8px 18px rgba(30,35,50,.28)}

/* ---------- fx layer ---------- */
#fx{pointer-events:none;z-index:5}
.cf,.pt{position:absolute;display:block;will-change:transform,opacity}
.pt{border-radius:50%}
.flash{position:absolute;inset:0;opacity:0}
.toast{position:absolute;left:50%;top:14px;transform:translate(-50%,-14px) scale(.96);opacity:0;background:var(--g-ink);color:#fff;font-family:var(--display);font-size:16px;padding:9px 22px;border-radius:999px;box-shadow:var(--sh-2);white-space:nowrap;transition:transform .3s var(--ease-out),opacity .22s var(--ease-out)}
.toast.ok{background:var(--g-ok)}
.toast.big{background:var(--g-brand);font-size:17px;padding:9px 24px}
.toast.show{transform:translate(-50%,0) scale(1);opacity:1}

/* ---------- title / gate ---------- */
.title-wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center}
.eyerow{display:flex;gap:8px;align-items:center}
.eyebrow{font-family:var(--display);font-size:14px;color:var(--ink2);background:rgba(255,255,255,.75);padding:4px 14px;border-radius:999px;box-shadow:var(--sh-1)}
.ver{font-family:var(--display);font-size:13px;color:#fff;background:var(--g-brand);padding:4px 12px;border-radius:999px;box-shadow:0 6px 14px rgba(123,112,220,.35);position:relative;overflow:hidden}
.ver::after{content:'';position:absolute;inset:0;background:linear-gradient(100deg,rgba(255,255,255,0) 30%,rgba(255,255,255,.5) 50%,rgba(255,255,255,0) 70%);animation:sheen 3.4s var(--ease-in-out) infinite}
.title-wrap h1{font-family:var(--display);font-weight:400;font-size:82px;line-height:1.05;margin:0;letter-spacing:-.01em;filter:drop-shadow(0 8px 18px rgba(123,112,220,.28))}
.title-wrap .motion{font-family:var(--display);font-size:20px;background:#fff;padding:9px 22px;border-radius:999px;box-shadow:var(--sh-1);display:flex;gap:10px;align-items:center}
.title-wrap .motion .tag{font-size:13px;color:#fff;background:var(--g-pro);padding:2px 10px;border-radius:999px}
.title-wrap .cast{display:flex;margin:6px 0 2px;gap:6px}
.title-wrap .cast span{display:block;width:60px;height:60px;border-radius:50%;padding:3px;background:var(--g-brand);box-shadow:var(--sh-1);animation:bob 2.6s var(--ease-in-out) infinite;animation-delay:calc(var(--i) * 180ms)}
.title-wrap .cast img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:2px solid #fff;display:block}
.title-wrap .lead{margin:0;max-width:620px;font-size:14.5px;color:var(--ink2);line-height:1.7}
.title-wrap .lead b{font-weight:700;color:var(--ink)}
.legend{display:flex;gap:8px;font-family:var(--display);font-size:13px}
.legend span{padding:3px 12px;border-radius:999px;color:#fff}
.legend .p{background:var(--g-pro)}.legend .c{background:var(--g-con)}.legend .b{background:var(--g-both)}
.privacy-note{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.8);padding:6px 8px 6px 16px;border-radius:999px;font-size:12.5px;color:var(--ink2);box-shadow:var(--sh-1)}
.privacy-note b{color:var(--ok);font-weight:700}
.chip-btn{font-family:var(--display);font-size:13px;padding:4px 12px;border-radius:999px;background:var(--surface-2);color:var(--ink)}
.startrow{display:flex;gap:10px;align-items:center;margin-top:4px}
.start-btn{font-family:var(--display);font-size:23px;background:var(--g-brand);color:#fff;padding:13px 42px;border-radius:999px;box-shadow:0 10px 26px rgba(123,112,220,.42)}
.start-btn.off{opacity:.42;filter:grayscale(.6);box-shadow:none;cursor:not-allowed}
.snd{width:50px;height:50px;border-radius:50%;background:#fff;box-shadow:var(--sh-1);font-size:20px;display:grid;place-items:center;position:relative;overflow:hidden;transition:transform .14s var(--ease-out)}
.snd:active{transform:scale(.93)}
.tiny{font-size:12.5px;color:var(--muted)}
.linkbtn{font-size:12.5px;color:var(--muted);text-decoration:underline;padding:2px 6px;border-radius:8px}
.gate{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:0 60px}
.gate .gtitle{font-family:var(--display);font-size:32px;line-height:1.2}
.gate .gcard{width:640px;background:#fff;border-radius:26px;box-shadow:var(--sh-2);padding:14px 22px 16px}
.gate .gitem{display:flex;gap:12px;align-items:flex-start;padding:6px 0;font-size:13.8px;line-height:1.6;color:var(--ink2)}
.gate .gitem+.gitem{border-top:1px solid var(--line)}
.gate .gitem i{font-style:normal;width:22px;height:22px;border-radius:50%;background:var(--g-ok);color:#fff;font-size:12px;display:grid;place-items:center;flex-shrink:0;margin-top:1px}
.gate .gitem b{color:var(--ink);font-weight:700}
.agree{display:flex;align-items:center;gap:12px;background:#fff;padding:11px 24px 11px 14px;border-radius:999px;font-family:var(--display);font-size:19px;box-shadow:var(--sh-1)}
.agree.on{box-shadow:0 0 0 3px rgba(52,168,83,.45),var(--sh-1)}
.agree .bx{width:28px;height:28px;border-radius:50%;border:2.5px solid #C4CAD6;display:grid;place-items:center;flex-shrink:0;transition:background-color .2s ease,border-color .2s ease}
.agree.on .bx{background:var(--green);border-color:var(--green)}
.bx svg{width:18px;height:18px}
.bx path{fill:none;stroke:#fff;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:24;stroke-dashoffset:24;animation:draw .28s var(--ease-out) .04s forwards}
.pbox{width:540px;max-height:450px;display:flex;flex-direction:column;background:#fff;border-radius:28px;box-shadow:var(--sh-3);overflow:hidden;animation:pop .24s var(--ease-out) backwards}
.pbox .band{background:var(--g-ok);color:#fff;font-family:var(--display);font-size:18px;padding:12px 22px}
.pbox .body{padding:14px 22px 6px;font-size:13.8px;line-height:1.75;overflow:auto}
.pbox h4{font-family:var(--display);font-weight:400;font-size:16px;margin:12px 0 2px;color:var(--ink)}
.pbox h4:first-child{margin-top:0}
.pbox p{margin:0;color:var(--ink2)}
.pbox .foot{margin-top:10px}

/* ---------- village ---------- */
.map{position:absolute;inset:66px 36px 22px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:1fr 1fr;gap:16px}
.loc{border-radius:26px;background:#222;text-align:left;box-shadow:var(--sh-2);isolation:isolate}
.loc img.scene{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .5s var(--ease-out);z-index:-1}
.loc.done{box-shadow:0 0 0 3px #fff,0 0 0 6px rgba(52,168,83,.85),var(--sh-2)}
.loc .grad{position:absolute;inset:0;background:linear-gradient(to top,rgba(16,20,36,.88) 0%,rgba(16,20,36,.25) 55%,rgba(16,20,36,0) 100%)}
.loc .info{position:absolute;left:12px;right:12px;bottom:12px;display:flex;gap:10px;align-items:flex-end;color:#fff}
.loc .face{width:54px;height:54px;border-radius:50%;padding:2px;background:var(--g-brand);flex-shrink:0}
.loc .face img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:2px solid #fff;display:block}
.loc .nm{font-family:var(--display);font-size:22px;line-height:1.1}
.loc .rl{font-size:12px;color:rgba(255,255,255,.78)}
.loc .place{position:absolute;top:10px;left:10px;font-family:var(--display);font-size:13px;background:rgba(255,255,255,.88);color:var(--ink);padding:3px 11px;border-radius:999px;box-shadow:var(--sh-1)}
.loc .dots{position:absolute;top:12px;right:12px;display:flex;gap:5px;background:rgba(16,20,36,.45);padding:5px 7px;border-radius:999px;backdrop-filter:blur(4px)}
.loc .dots i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.4);display:block}
.loc .dots i.on{background:#6BE39A;box-shadow:0 0 6px rgba(107,227,154,.8)}
.loc .expbadge{position:absolute;right:10px;bottom:14px;font-family:var(--display);font-size:13px;background:var(--g-gold);color:#3A2600;padding:4px 11px;border-radius:999px;overflow:hidden;box-shadow:0 4px 12px rgba(251,188,4,.4)}
.loc .expbadge.live::after{content:'';position:absolute;inset:0;background:linear-gradient(100deg,rgba(255,255,255,0) 30%,rgba(255,255,255,.65) 50%,rgba(255,255,255,0) 70%);animation:sheen 2.6s var(--ease-in-out) infinite}
.loc .expbadge.done{background:var(--g-ok);color:#fff;box-shadow:none}
.loc .expbadge.locked{background:rgba(255,255,255,.22);color:#fff;box-shadow:none;backdrop-filter:blur(4px)}
@media (hover:hover) and (pointer:fine){
  .loc:hover{transform:translateY(-4px)}
  .loc:hover img.scene{transform:scale(1.06)}
  .mi:hover{transform:translateX(4px);box-shadow:var(--sh-2)}
  .mi:hover::before{transform:scale(1.35)}
  .start-btn:not(.off):hover,.hud-btn:hover,.gbtn:hover,.choose button:hover{transform:translateY(-2px)}
  .pick:hover{box-shadow:var(--sh-2)}
  .kiosk.easy .kb:hover{transform:translateY(-2px)}
  .agree:hover{box-shadow:0 0 0 3px rgba(66,133,244,.25),var(--sh-1)}
  .agree.on:hover{box-shadow:0 0 0 3px rgba(52,168,83,.55),var(--sh-1)}
}

/* ---------- kiosk ---------- */
.kwrap{position:absolute;inset:0;padding-top:40px;display:flex;align-items:center;justify-content:center;gap:34px}
.kside{width:300px;display:flex;flex-direction:column;gap:12px}
.kside .mission{background:#fff;border-radius:22px;box-shadow:var(--sh-1);padding:14px 18px}
.kside .mission .l{font-family:var(--display);font-size:13px;letter-spacing:.14em}
.kside .mission .t{font-family:var(--display);font-size:22px;line-height:1.3;margin-top:2px}
.kside .think{font-size:14.5px;color:#B3401F;min-height:2.8em;background:#fff;padding:10px 14px;border-radius:18px 18px 18px 6px;box-shadow:var(--sh-1);line-height:1.6}
.kside .think:empty{visibility:hidden}
.kside .knote{font-size:12.5px;color:var(--ink2);line-height:1.6}
.kiosk{width:300px;height:420px;background:linear-gradient(160deg,#3A4153 0%,#151922 100%);border-radius:30px;padding:14px;box-shadow:var(--sh-3),inset 0 1px 0 rgba(255,255,255,.12);font-family:'Helvetica Neue',Arial,sans-serif;color:#E9EEF3;position:relative}
.kiosk .screen-in{background:#1B2129;border-radius:18px;height:100%;padding:10px;display:flex;flex-direction:column;gap:7px;position:relative;overflow:hidden}
.kiosk.hard .screen-in{font-size:10px;filter:blur(.4px);letter-spacing:-.01em;border-radius:6px}
.kiosk.hard .kb{background:#2A3441;color:#E9EEF3;border-radius:4px;padding:6px 7px;font-size:10px;text-align:left;line-height:1.3;border:1px solid #3A4553}
.kiosk.hard .kb.on{border-color:#F59E0B;background:#3A3320}
.kiosk.hard .kb.primary{background:#F59E0B;color:#111}
.kiosk.hard .kb.tiny{font-size:8.5px;padding:3px 6px;color:#9AA6B3}
.kiosk .grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:5px}
.kiosk .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.kiosk .khead{display:flex;justify-content:space-between;font-size:8.5px;color:#9AA6B3;text-transform:uppercase;letter-spacing:.08em}
.kiosk .ktitle{font-size:12.5px;font-weight:700;color:#fff}
.kiosk .ad{position:absolute;inset:0;background:linear-gradient(160deg,#F59E0B,#DC2626 60%,#7C2D12);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:8px;padding:18px;text-align:center;color:#fff;font-family:var(--body)}
.kiosk .ad .big{font-size:26px;line-height:1.1;text-shadow:0 2px 6px rgba(0,0,0,.4);font-family:var(--display)}
.kiosk .ad .x{position:absolute;top:6px;right:8px;width:15px;height:15px;border-radius:50%;background:rgba(255,255,255,.25);color:#fff;font-size:9px;display:grid;place-items:center}
.kiosk .ad .fake{margin-top:8px;background:#fff;color:#B91C1C;font-weight:800;padding:9px 20px;border-radius:999px;font-size:14px}
.kiosk .footerbar{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:6px;border-top:1px solid #3A4553;padding-top:7px}
.kiosk .kpad{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;max-width:170px;margin:0 auto}
.kiosk .kpad .kb{text-align:center}
.kiosk .opt{display:flex;justify-content:space-between;align-items:center;gap:6px;border-bottom:1px dashed #3A4553;padding:4px 0}
.kiosk .opt .grp{display:flex;gap:4px}
.kiosk .cardslot{margin-top:auto;border:2px dashed #9AA6B3;border-radius:6px;padding:10px;text-align:center;font-size:11px;color:#9AA6B3}
.kiosk.easy .screen-in{background:linear-gradient(170deg,#F5F8FF 0%,#EEF0FB 100%);color:var(--ink);font-size:18px;gap:12px;font-family:var(--body);padding:14px}
.kiosk.easy .screen-in.step{animation:rise .24s var(--ease-out) backwards}
.kiosk.easy .kb{background:#fff;color:var(--ink);border-radius:20px;padding:16px 8px;font-size:20px;font-family:var(--display);text-align:center;line-height:1.25;box-shadow:0 2px 6px rgba(20,30,70,.08),0 8px 18px rgba(20,30,70,.08)}
.kiosk.easy .kb small{font-size:14px;font-family:var(--body);color:var(--muted)}
.kiosk.easy .ktitle{font-size:21px;font-family:var(--display);text-align:center;font-weight:400;color:var(--ink);line-height:1.3}
.kiosk.easy .help{margin-top:auto;font-size:13.5px;color:var(--muted);text-align:center}
.kiosk.easy .cardslot{font-size:14px;padding:12px;border-color:#B8C0D6;border-radius:16px;color:var(--muted)}

/* ---------- shop ---------- */
.shopres{position:absolute;inset:60px 40px 176px;display:grid;grid-template-columns:400px 1fr;gap:18px}
.ledger{background:#fff;border-radius:24px;box-shadow:var(--sh-2);padding:10px 18px 12px;font-variant-numeric:tabular-nums;align-self:start}
.ledger .h{font-family:var(--display);font-size:19px;padding-bottom:4px;margin-bottom:2px;display:flex;justify-content:space-between;align-items:center}
.ledger .h .idx{font-size:14px;color:#fff;background:var(--g-brand);padding:2px 12px;border-radius:999px}
.ledger .li{display:flex;justify-content:space-between;gap:12px;padding:3px 0;border-bottom:1px dashed var(--line);font-size:13.5px;color:var(--ink2)}
.ledger .li.total{font-family:var(--display);font-size:21px;border-bottom:0;margin-top:6px;padding:7px 14px;border-radius:16px;background:var(--g-brand);color:#fff}
.ledger .neg{color:var(--pro)}.ledger .pos{color:var(--ok)}.ledger .zero{color:var(--muted)}
.events{display:flex;flex-direction:column;gap:8px;align-self:start}
.ev{display:flex;gap:10px;align-items:flex-start;background:#fff;border-radius:18px;box-shadow:var(--sh-1);padding:10px 14px;font-size:13.8px;line-height:1.55;color:var(--ink2)}
.ev .ic{font-size:20px;flex-shrink:0}
.compare{display:flex;gap:8px;margin-top:8px}
.compare .c{flex:1;background:#fff;border-radius:18px;box-shadow:var(--sh-1);padding:8px;text-align:center}
.compare .c .n{font-family:var(--display);font-size:22px}
.compare .c .l{font-size:11.5px;color:var(--muted)}
.fine{font-size:11.5px;color:var(--muted);margin-top:8px}

/* ---------- notes ---------- */
.notes{position:absolute;inset:62px 36px 20px;background:rgba(255,255,255,.94);border-radius:28px;box-shadow:var(--sh-2);display:flex;flex-direction:column;overflow:hidden}
.ntop{display:flex;align-items:center;padding:12px 14px 10px 16px;gap:10px}
.seg{position:relative;display:flex;background:var(--surface-2);border-radius:999px;padding:4px}
.seg .ind{position:absolute;left:4px;top:4px;width:200px;height:calc(100% - 8px);border-radius:999px;background:var(--g-brand);box-shadow:0 6px 14px rgba(123,112,220,.35);transition:transform .32s var(--ease-in-out)}
.seg button{position:relative;z-index:1;width:200px;font-family:var(--display);font-size:16px;padding:8px 0;border-radius:999px;color:var(--ink2);overflow:visible;transition:color .2s ease,transform .14s var(--ease-out)}
.seg button.on{color:#fff}
.ntop .sp{flex:1}
.nbody{flex:1;min-height:0;overflow:auto;padding:4px 18px 16px}
.nbody.enter{animation:rise .3s var(--ease-out) backwards}
.nlead{margin:0 0 10px;font-size:13px;color:var(--muted);line-height:1.6}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.col h3{font-family:var(--display);font-weight:400;font-size:18px;margin:0 0 8px;padding:7px 14px;display:flex;justify-content:space-between;align-items:center;border-radius:16px;color:#fff}
.col.pro h3{background:var(--g-pro)}.col.con h3{background:var(--g-con)}
.col h3 .cnt{font-size:13px;background:rgba(255,255,255,.25);padding:1px 10px;border-radius:999px}
.col .list{display:flex;flex-direction:column;gap:7px}
.pick{display:flex;gap:10px;align-items:flex-start;background:#fff;border-radius:18px;padding:10px 12px;text-align:left;width:100%;box-shadow:0 0 0 1.5px var(--line)}
.pick.on{box-shadow:0 0 0 2px rgba(123,112,220,.75),0 6px 16px rgba(123,112,220,.18)}
.col.pro .pick.on{box-shadow:0 0 0 2px rgba(234,84,53,.7),0 6px 16px rgba(234,84,53,.16);background:var(--pro-soft)}
.col.con .pick.on{box-shadow:0 0 0 2px rgba(26,115,232,.7),0 6px 16px rgba(26,115,232,.16);background:var(--con-soft)}
.pick .box{width:22px;height:22px;border-radius:50%;border:2px solid #C4CAD6;flex-shrink:0;margin-top:2px;display:grid;place-items:center;font-size:12px;color:#fff;background:#fff}
.col.pro .pick.on .box{background:var(--g-pro);border-color:transparent}
.col.con .pick.on .box{background:var(--g-con);border-color:transparent}
.pick .box.pop{animation:boxpop .3s var(--ease-out)}
@keyframes boxpop{0%{transform:scale(.8)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
.pick .who{font-size:11px;color:var(--muted)}
.pick .tt{font-family:var(--display);font-size:16px;line-height:1.25;color:var(--ink)}
.pick .tx{font-size:12.3px;line-height:1.5;color:var(--ink2)}
.pick .bm{color:var(--both);font-weight:700}
.pick .mv{margin-left:auto;font-family:var(--display);font-size:12px;color:#fff;background:var(--g-both);padding:3px 10px;border-radius:999px;flex-shrink:0;align-self:center;transition:transform .14s var(--ease-out)}
.pick .mv:active{transform:scale(.92)}
.empty{padding:16px;border:2px dashed #D5DAE5;border-radius:18px;color:var(--muted);font-size:13.5px;text-align:center}
.stance{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stance button{padding:12px;border-radius:999px;font-family:var(--display);font-size:19px;background:var(--surface-2);color:var(--ink2)}
.stance .pro.on{background:var(--g-pro);color:#fff;box-shadow:0 8px 18px rgba(234,67,53,.3)}
.stance .con.on{background:var(--g-con);color:#fff;box-shadow:0 8px 18px rgba(26,115,232,.3)}
.stance button.on{animation:pop .24s var(--ease-out)}
.field label{display:block;font-family:var(--display);font-size:14.5px;margin-bottom:5px;color:var(--ink)}
textarea{font:inherit;font-size:13.5px;width:100%;background:var(--surface-2);color:var(--ink);border:2px solid transparent;border-radius:16px;padding:10px 14px;resize:vertical;min-height:70px;transition:border-color .2s ease,background-color .2s ease}
textarea:focus{border-color:rgba(66,133,244,.55);background:#fff;outline:none}
.out{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.3px;min-height:170px;line-height:1.55}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.gbtn{font-family:var(--display);font-size:16px;background:var(--g-brand);color:#fff;padding:9px 20px;border-radius:999px;box-shadow:0 6px 16px rgba(123,112,220,.35)}
.gbtn.ghost{background:#fff;color:var(--ink);box-shadow:var(--sh-1)}
.rotate{position:fixed;inset:0;background:linear-gradient(150deg,#EAF2FF,#F3ECFF 50%,#FFEDF2);color:var(--ink);display:none;place-items:center;text-align:center;font-family:var(--display);font-size:22px;z-index:50;padding:20px}
@media (orientation:portrait) and (max-width:700px){.rotate{display:grid}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-name:fade!important;animation-duration:.2s!important;animation-iteration-count:1!important;animation-delay:0s!important}
  .bx path{animation:none!important;stroke-dashoffset:0}
  .ring .val,.seg .ind{transition:none!important}
}
</style>

/* ---------- 효과음 (Web Audio 합성 · 기본 꺼짐 · 외부 파일 없음) ---------- */
const SKEY='kiosk-village-3beta-sound';
const SFX=(()=>{
  let ctx=null, on=false; try{ on=localStorage.getItem(SKEY)==='1'; }catch(e){}
  function ac(){ if(!ctx){ const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; ctx=new C(); } if(ctx.state==='suspended') ctx.resume(); return ctx; }
  function tone(f, t0, dur, type, vol, f2){
    const c=ac(); if(!c) return; const t=c.currentTime+t0;
    const o=c.createOscillator(), g=c.createGain(); o.type=type||'sine';
    o.frequency.setValueAtTime(f,t); if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+dur);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol||.06,t+.012); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+dur+.03);
  }
  const P={
    tap:()=>tone(520,0,.07,'sine',.045,760),
    pop:()=>tone(700,0,.09,'triangle',.06,1050),
    card:()=>[523,659,784,1047].forEach((f,i)=>tone(f,i*.06,.2,'triangle',.055)),
    good:()=>{ tone(784,0,.12,'sine',.07); tone(1175,.09,.24,'sine',.07); },
    bad:()=>{ tone(240,0,.16,'square',.035,170); tone(180,.12,.2,'square',.03,130); },
    whoosh:()=>tone(260,0,.28,'sine',.035,980),
    win:()=>[523,659,784,1047,1319].forEach((f,i)=>tone(f,i*.08,.34,'triangle',.06))
  };
  return {
    get on(){ return on; },
    toggle(){ on=!on; try{ localStorage.setItem(SKEY,on?'1':'0'); }catch(e){} if(on){ ac(); P.pop(); } return on; },
    play(n){ if(on&&P[n]) try{ P[n](); }catch(e){} }
  };
})();

/* ---------- 움직임 도구 ---------- */
const fx = {lastKey:null, bgSrc:null, bgCls:null, pending:0, closing:false, prevTabIdx:null};
fx.enter = key => { if(fx.lastKey===key) return false; fx.lastKey=key; return true; };
function stagePt(el){ const s=stage.getBoundingClientRect(), r=el.getBoundingClientRect(); return {x:(r.left-s.left+r.width/2)/SCALE, y:(r.top-s.top+r.height/2)/SCALE, w:r.width/SCALE, h:r.height/SCALE}; }
const PALETTE={pro:['#FFA25F','#FF6B4A','#EA4335','#FBBC04'], con:['#5AB0FF','#1A73E8','#12A4C8','#34A853'], both:['#B892FF','#9B72CB','#D96570','#FBBC04'], brand:['#4285F4','#9B72CB','#D96570','#FBBC04','#34A853']};
function burst(x,y,colors,n){
  if(REDUCED()) return; n=n||18;
  for(let i=0;i<n;i++){
    const p=document.createElement('i'); p.className='pt'; const sz=5+Math.random()*7;
    p.style.cssText=`left:${x-sz/2}px;top:${y-sz/2}px;width:${sz}px;height:${sz}px;background:${colors[i%colors.length]}`;
    L.fx.appendChild(p);
    const a=(Math.PI*2*i/n)+Math.random()*.4, d=60+Math.random()*90;
    p.animate([{transform:'translate(0,0) scale(1)',opacity:1},{transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d}px) scale(.3)`,opacity:0}],{duration:560+Math.random()*200,easing:'cubic-bezier(0.23,1,0.32,1)'}).onfinish=()=>p.remove();
  }
}
function confetti(n){
  if(REDUCED()) return; n=n||90; const colors=PALETTE.brand;
  for(let i=0;i<n;i++){
    const p=document.createElement('i'); p.className='cf'; const left=i%2===0;
    const w=6+Math.random()*6, h=w*(Math.random()<.5?1:1.9);
    p.style.cssText=`left:${left?30:930}px;top:560px;width:${w}px;height:${h}px;background:${colors[i%colors.length]};border-radius:${Math.random()<.4?'50%':'3px'}`;
    L.fx.appendChild(p);
    const vx=(left?1:-1)*(140+Math.random()*460), peak=-(300+Math.random()*260), rot=Math.random()*900-450;
    p.animate([
      {transform:'translate(0,0) rotate(0deg)',opacity:1,easing:'cubic-bezier(0.23,1,0.32,1)'},
      {transform:`translate(${vx*.6}px,${peak}px) rotate(${rot*.5}deg)`,opacity:1,offset:.42,easing:'cubic-bezier(0.55,0,0.85,0.4)'},
      {transform:`translate(${vx}px,${peak+420}px) rotate(${rot}deg)`,opacity:0}
    ],{duration:1500+Math.random()*700,delay:Math.random()*160,easing:'linear'}).onfinish=()=>p.remove();
  }
}
function flash(color){
  const f=document.createElement('div'); f.className='flash'; f.style.background=`radial-gradient(ellipse at center,rgba(255,255,255,0) 45%,${color} 100%)`;
  L.fx.appendChild(f); f.animate([{opacity:0},{opacity:1,offset:.25},{opacity:0}],{duration:560,easing:'ease'}).onfinish=()=>f.remove();
}
function countUp(el, to, ms){
  if(!el) return; if(REDUCED()){ el.textContent=to.toLocaleString(); return; }
  const t0=performance.now(); const step=t=>{ const k=Math.min(1,(t-t0)/ms); const e=1-Math.pow(1-k,4); el.textContent=Math.round(to*e).toLocaleString(); if(k<1) requestAnimationFrame(step); }; requestAnimationFrame(step);
}

/* 머티리얼 물결 효과 · 대사창과 '어려운 키오스크'에는 일부러 넣지 않음 */
const RIPPLE_SEL='.mi,.loc,.start-btn,.hud-btn,.hud-ic,.snd,.gbtn,.agree,.choose button,.pick,.stance button,.kiosk.easy .kb,.foot,.chip-btn';

  const d=Math.hypot(Math.max(x,w-x),Math.max(y,h-y))*2;
  const s=document.createElement('span'); s.className='ripple'; s.style.cssText=`width:${d}px;height:${d}px;left:${x-d/2}px;top:${y-d/2}px`;
  el.appendChild(s); s.addEventListener('animationend',()=>s.remove());
});

let typer=null;

function showLine(){
  const d=tmp.dlg; if(!d) return; const l=d.lines[d.i];

function kioskInit(mode){
  tmp.k={mode, step:mode==='hard'?'ad':'cat', lang:'en', temp:'ICED', size:'Tall', place:null, time:mode==='hard'?45:0, phase:'play', msg:'', fresh:true, shown:null};
  stopTimer(); clearDlg(); setMenu(null); L.popup.innerHTML='';
  if(mode==='hard'){ timerId=setInterval(()=>{ const k=tmp.k; if(!k||k.phase!=='play') return; k.time--; if(k.time===20) k.msg='뒤에서 누가 한숨을 쉰다…'; if(k.time===10) k.msg='"저기요, 빨리 좀 해 주세요."'; if(k.time<=0){ stopTimer(); kioskEnd(false,'시간 초과. 뒤에 줄이 길어져서 할아버지는 주문을 포기하고 가게를 나섰다.'); return; } kioskRender(); },1000); }
  kioskRender();
}
function kioskRender(){
  const k=tmp.k; if(!k) return;

const QUIET = new Set(['next','popclose','side','sound','k','k-ad','k-set','k-key','k-place','k-fail','k-finish','k-easy-finish','agree','pick','copy','move']);
stage.addEventListener('click', e=>{

      const tip=L.content.querySelector('.gate-tip'); if(tip) tip.textContent=on?'이제 게임을 시작할 수 있어요':'위 버튼을 눌러 체크하면 확인 버튼이 켜져요';

    case 'k-ad': tmp.k.msg='광고를 눌렀다. 밀크티 화면이 열렸다가 닫혔다. 5초가 날아갔다.'; tmp.k.time=Math.max(1,tmp.k.time-5); kioskRender(); break;

      break; }
    case 'stance': S.stance=d.val; save(); showNotes(); break;
    case 'copy': { const txt=buildOutput(); const done=()=>{ SFX.play('good'); toast('복사했어. Padlet에 붙여 넣자!','ok'); }; try{ navigator.clipboard.writeText(txt).then(done,()=>fallbackCopy(done)); }catch(err){ fallbackCopy(done); } break; }
  }
});
stage.addEventListener('input', e=>{
  if(e.target.id==='reason'){ S.reason=e.target.value; save(); const o=document.getElementById('out'); if(o) o.value=buildOutput(); }
});
addEventListener('keydown', e=>{
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA') return;
  if(e.key===' '||e.key==='Enter'){ if(L.popup.innerHTML){ if(L.popup.querySelector('.foot')){ e.preventDefault(); popclose(); } } else if(tmp.dlg){ e.preventDefault(); next(); } }
});

if(S.agreed) showTitle(); else showGate();

})();
</script>
