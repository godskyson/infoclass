<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>키오스크 마을</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gowun+Dodum&display=swap">
<style>
:root{
  --ink:#F2F5F9; --muted:#AAB6C6; --gold:#F2C14E; --gold-ink:#1A1206;
  --panel:rgba(8,12,18,.84); --panel-line:rgba(255,255,255,.16); --panel-solid:#121A25;
  --pro:#FF8A50; --pro-bg:#3A1F12; --con:#4FC8E0; --con-bg:#0F2F38; --both:#C4A6FF; --both-bg:#2A1F45; --ok:#5EE39A;
  --display:'Do Hyeon','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --body:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
html,body{height:100%}
body{margin:0;background:#07090D;overflow:hidden;color:var(--ink);font-family:var(--body)}
#root{position:fixed;inset:0;display:grid;place-items:center;background:#07090D}
#stage{width:960px;height:540px;position:relative;overflow:hidden;background:#0E141C;transform-origin:center center;user-select:none;font-size:16px;line-height:1.5}
#stage *{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.layer{position:absolute;inset:0}
#bg img{width:100%;height:100%;object-fit:cover;display:block;transition:opacity .4s}
#bg .dim{position:absolute;inset:0;background:linear-gradient(to top,rgba(5,8,12,.75) 0%,rgba(5,8,12,.15) 45%,rgba(5,8,12,.35) 100%)}
#bg.heavy .dim{background:rgba(5,8,12,.78)}
#bg.blur img{filter:blur(6px) saturate(.8);transform:scale(1.05)}
#content{pointer-events:none}
#content > *{pointer-events:auto}
#hud{pointer-events:none;padding:14px 18px;display:flex;justify-content:space-between;align-items:flex-start}
#hud > *{pointer-events:auto}
#hud:empty{display:none}
.hud-loc{font-family:var(--display);font-size:18px;letter-spacing:.04em;background:var(--panel);border:1px solid var(--panel-line);padding:6px 14px;border-left:4px solid var(--gold)}
.hud-right{display:flex;gap:8px;align-items:center}
.hud-cards{font-family:var(--display);font-size:18px;background:var(--panel);border:1px solid var(--panel-line);padding:6px 14px;display:flex;gap:8px;align-items:center;font-variant-numeric:tabular-nums}
.hud-cards b{color:var(--gold);font-weight:400}
.hud-btn{font-family:var(--display);font-size:17px;background:var(--gold);color:var(--gold-ink);padding:7px 14px;letter-spacing:.03em;clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%)}
.hud-btn.ghost{background:var(--panel);color:var(--ink);border:1px solid var(--panel-line);clip-path:none}
.hud-timer{font-family:var(--display);font-size:26px;background:var(--panel);border:1px solid var(--panel-line);padding:4px 16px;font-variant-numeric:tabular-nums;color:var(--gold)}
.hud-timer.hurry{color:var(--pro);animation:blink .6s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}

/* dialogue */
#dlg{top:auto;bottom:0;padding:0 24px 22px}
#dlg:empty{display:none}
.dbox{position:relative;background:var(--panel);border:1px solid var(--panel-line);border-top:2px solid rgba(242,193,78,.7);min-height:132px;padding:22px 150px 20px 26px;cursor:pointer;backdrop-filter:blur(4px)}
.dbox .name{position:absolute;top:-16px;left:18px;font-family:var(--display);font-size:19px;background:var(--gold);color:var(--gold-ink);padding:4px 16px;letter-spacing:.04em;clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%)}
.dbox .name.me{background:#DDE6F2}
.dbox .dtext{font-size:19px;line-height:1.65;min-height:3.3em}
.dbox .face{position:absolute;right:22px;top:-40px;width:110px;height:110px;border-radius:6px;object-fit:cover;border:2px solid rgba(255,255,255,.35);box-shadow:0 8px 20px rgba(0,0,0,.5)}
.dbox .next{position:absolute;right:20px;bottom:12px;font-family:var(--display);font-size:14px;color:var(--gold);animation:bob 1s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(3px)}}

/* menu */
#menu{display:flex;align-items:center;justify-content:center;pointer-events:none}
#menu:empty{display:none}
.mlist{pointer-events:auto;display:flex;flex-direction:column;gap:8px;width:560px;max-height:380px}
.mlist.bottom{position:absolute;bottom:170px}
.mtitle{font-family:var(--display);font-size:16px;color:var(--gold);letter-spacing:.1em;text-align:center;margin-bottom:2px;text-shadow:0 2px 8px #000}
.mi{background:var(--panel);border:1px solid var(--panel-line);padding:12px 18px 12px 22px;text-align:left;font-size:17px;display:flex;gap:12px;align-items:center;transition:transform .12s,border-color .12s;position:relative}
.mi::before{content:'▸';font-family:var(--display);color:var(--gold);opacity:0;transition:opacity .12s}
.mi:hover,.mi:focus-visible{border-color:var(--gold);transform:translateX(6px)}
.mi:hover::before{opacity:1}
.mi.asked{color:var(--muted)}
.mi.asked::after{content:'✓';margin-left:auto;color:var(--ok);font-family:var(--display)}
.mi.exp{border-color:rgba(242,193,78,.5);background:rgba(242,193,78,.12)}
.mi.sub{font-size:15px;color:var(--muted)}
.mi[disabled]{opacity:.45;cursor:not-allowed;transform:none}

/* popup */
#popup{display:grid;place-items:center;background:rgba(3,5,8,.55)}
#popup:empty{display:none}
.cardpop{width:420px;background:var(--panel-solid);border:1px solid var(--panel-line);box-shadow:0 30px 60px rgba(0,0,0,.6);animation:flip .45s cubic-bezier(.2,.8,.2,1);overflow:hidden;cursor:pointer}
@keyframes flip{from{transform:perspective(800px) rotateY(90deg) scale(.9);opacity:0}to{transform:none;opacity:1}}
.cardpop .band{padding:8px 18px;font-family:var(--display);font-size:15px;letter-spacing:.12em;display:flex;justify-content:space-between}
.cardpop.pro .band{background:var(--pro);color:#1A0A03}
.cardpop.con .band{background:var(--con);color:#03191E}
.cardpop.both .band{background:var(--both);color:#150A2E}
.cardpop .body{padding:18px 20px 16px}
.cardpop .got{font-family:var(--display);font-size:14px;color:var(--gold);letter-spacing:.14em}
.cardpop h3{font-family:var(--display);font-weight:400;font-size:26px;margin:4px 0 8px;line-height:1.2}
.cardpop p{margin:0;font-size:15px;line-height:1.6;color:#D7DFE9}
.cardpop .who{font-size:12.5px;color:var(--muted);margin-top:10px}
.cardpop .foot{border-top:1px solid var(--panel-line);padding:10px 18px;text-align:right;font-family:var(--display);color:var(--gold);font-size:15px;cursor:pointer}
.cardpop.neutral .band{background:var(--gold);color:var(--gold-ink)}
.cardpop .ask{padding:0 18px 6px;font-size:13.5px;color:var(--muted)}
.cardpop .ask b{color:var(--ink)}
.cardpop .choose{display:flex;gap:10px;padding:0 18px 16px}
.cardpop .choose button{flex:1;padding:11px;font-family:var(--display);font-size:19px;border:2px solid;background:rgba(255,255,255,.03);transition:background .12s}
.cardpop .choose .pb{border-color:var(--pro);color:var(--pro)}.cardpop .choose .pb:hover{background:var(--pro-bg)}
.cardpop .choose .cb{border-color:var(--con);color:var(--con)}.cardpop .choose .cb:hover{background:var(--con-bg)}
.cardpop .hint{background:#3A1F12;color:#FFC9AE;padding:10px 18px;font-size:14px;line-height:1.5;border-top:1px solid var(--pro);animation:shake .4s}
.cardpop .note{background:var(--both-bg);color:var(--both);padding:8px 18px;font-size:13px;line-height:1.5}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.pick .mv{margin-left:auto;font-family:var(--display);font-size:12px;color:var(--both);border:1px solid var(--both);padding:2px 7px;flex-shrink:0;align-self:center}
.toast{position:absolute;left:50%;top:70px;transform:translateX(-50%);background:var(--gold);color:var(--gold-ink);font-family:var(--display);font-size:16px;padding:6px 18px;box-shadow:0 6px 20px rgba(0,0,0,.5);animation:fadeup .3s}
@keyframes fadeup{from{opacity:0;transform:translate(-50%,8px)}}

/* title */
.title-wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center}
.title-wrap .eyebrow{font-family:var(--display);color:var(--gold);letter-spacing:.3em;font-size:15px;text-shadow:0 2px 10px #000}
.title-wrap h1{font-family:var(--display);font-weight:400;font-size:84px;line-height:1;margin:0;letter-spacing:.02em;text-shadow:0 4px 0 #3A2A05,0 12px 30px rgba(0,0,0,.7)}
.title-wrap .motion{font-family:var(--display);font-size:22px;background:var(--panel);border:1px solid var(--panel-line);border-left:4px solid var(--pro);padding:8px 20px;margin-top:8px}
.title-wrap .cast{display:flex;margin:10px 0 6px}
.title-wrap .cast img{width:58px;height:58px;border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,.7);margin-left:-10px;box-shadow:0 4px 12px rgba(0,0,0,.5)}
.title-wrap .cast img:first-child{margin-left:0}
.gate{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:0 60px}
.gate .gtitle{font-family:var(--display);font-size:30px;letter-spacing:.02em;text-shadow:0 3px 14px #000}
.gate .geyebrow{font-family:var(--display);color:var(--gold);letter-spacing:.26em;font-size:13px;text-shadow:0 2px 10px #000}
.gate .gcard{width:620px;background:var(--panel);border:1px solid var(--panel-line);border-top:2px solid var(--gold);padding:16px 22px 18px;backdrop-filter:blur(4px)}
.gate .gitem{display:flex;gap:11px;align-items:flex-start;padding:6px 0;font-size:14.5px;line-height:1.6;color:#D7DFE9}
.gate .gitem i{font-style:normal;color:var(--ok);font-family:var(--display);flex-shrink:0}
.gate .gitem b{color:#fff;font-weight:400;font-family:var(--display)}
.gate .agree{display:flex;align-items:center;gap:12px;background:var(--panel);border:2px solid var(--panel-line);padding:12px 20px;font-family:var(--display);font-size:20px;transition:border-color .15s,background .15s}
.gate .agree:hover{border-color:var(--gold)}
.gate .agree.on{border-color:var(--ok);background:rgba(94,227,154,.1)}
.gate .agree .bx{width:26px;height:26px;border:2px solid var(--muted);display:grid;place-items:center;font-size:17px;flex-shrink:0}
.gate .agree.on .bx{background:var(--ok);border-color:var(--ok);color:#05210F}
.privacy-note{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--panel-line);padding:7px 14px;font-size:13px;color:var(--muted)}
.privacy-note b{color:var(--ok);font-weight:400;font-family:var(--display)}
.privacy-note button{font-family:var(--display);color:var(--gold);font-size:13px;text-decoration:underline}
.pbox{width:520px;max-height:440px;overflow:auto;background:var(--panel-solid);border:1px solid var(--panel-line);box-shadow:0 30px 60px rgba(0,0,0,.6)}
.pbox .band{background:var(--gold);color:var(--gold-ink);font-family:var(--display);font-size:17px;padding:8px 18px;letter-spacing:.06em}
.pbox .body{padding:16px 20px;font-size:14px;line-height:1.75}
.pbox h4{font-family:var(--display);font-weight:400;font-size:16px;color:var(--gold);margin:12px 0 2px}
.pbox h4:first-child{margin-top:0}
.pbox p{margin:0;color:#D7DFE9}
.pbox .foot{border-top:1px solid var(--panel-line);padding:10px 18px;text-align:right;font-family:var(--display);color:var(--gold);font-size:15px;cursor:pointer}
.start-btn{font-family:var(--display);font-size:24px;background:var(--gold);color:var(--gold-ink);padding:12px 38px;letter-spacing:.08em;clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%);margin-top:6px;box-shadow:0 8px 24px rgba(242,193,78,.35)}
.start-btn:hover{filter:brightness(1.08)}
.tiny{font-size:12.5px;color:var(--muted);text-shadow:0 1px 4px #000}
.legend{display:flex;gap:10px;font-family:var(--display);font-size:13px;letter-spacing:.04em}
.legend span{padding:3px 10px;border:1px solid}
.legend .p{color:var(--pro);border-color:var(--pro)}.legend .c{color:var(--con);border-color:var(--con)}.legend .b{color:var(--both);border-color:var(--both)}

/* village map */
.map{position:absolute;inset:60px 40px 24px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:1fr 1fr;gap:14px}
.loc{position:relative;overflow:hidden;border:2px solid rgba(255,255,255,.18);background:#000;text-align:left;box-shadow:0 10px 30px rgba(0,0,0,.5);transition:transform .15s,border-color .15s}
.loc img.scene{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.85;transition:transform .4s}
.loc:hover{transform:translateY(-4px);border-color:var(--gold)}
.loc:hover img.scene{transform:scale(1.06)}
.loc.done{border-color:var(--ok)}
.loc .grad{position:absolute;inset:0;background:linear-gradient(to top,rgba(4,7,11,.92) 0%,rgba(4,7,11,.25) 55%,rgba(4,7,11,0) 100%)}
.loc .info{position:absolute;left:12px;right:12px;bottom:10px;display:flex;gap:10px;align-items:flex-end}
.loc .face{width:52px;height:52px;border-radius:50%;object-fit:cover;border:2px solid #fff;flex-shrink:0}
.loc .nm{font-family:var(--display);font-size:22px;line-height:1.1}
.loc .rl{font-size:12.5px;color:var(--muted)}
.loc .place{position:absolute;top:8px;left:10px;font-family:var(--display);font-size:13px;letter-spacing:.06em;background:var(--panel);border:1px solid var(--panel-line);padding:2px 8px}
.loc .dots{position:absolute;top:10px;right:10px;display:flex;gap:4px}
.loc .dots i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.3);display:block;border:1px solid rgba(0,0,0,.4)}
.loc .dots i.on{background:var(--ok)}
.loc .expbadge{position:absolute;right:10px;bottom:12px;font-family:var(--display);font-size:13px;background:var(--gold);color:var(--gold-ink);padding:3px 9px;clip-path:polygon(5px 0,100% 0,calc(100% - 5px) 100%,0 100%)}
.loc .expbadge.done{background:var(--ok)}
.loc .expbadge.locked{background:rgba(255,255,255,.18);color:#fff}

/* kiosk device */
.kwrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:34px;padding-bottom:0}
.kside{width:300px;display:flex;flex-direction:column;gap:12px}
.kside .mission{background:var(--panel);border:1px solid var(--panel-line);padding:12px 16px}
.kside .mission .l{font-family:var(--display);color:var(--gold);letter-spacing:.12em;font-size:13px}
.kside .mission .t{font-family:var(--display);font-size:22px;line-height:1.25;margin-top:2px}
.kside .think{font-size:15px;color:#FFB08C;font-style:italic;min-height:2.6em;background:rgba(8,12,18,.6);padding:8px 12px;border-left:3px solid var(--pro)}
.kside .note{font-size:12.5px;color:var(--muted)}
.kiosk{width:300px;height:430px;background:#0B0E12;border-radius:16px;padding:12px;border:5px solid #2A323C;box-shadow:0 30px 60px rgba(0,0,0,.7),inset 0 0 0 1px #000;font-family:'Helvetica Neue',Arial,sans-serif;color:#E9EEF3;position:relative}
.kiosk .screen-in{background:#1B2129;border-radius:8px;height:100%;padding:10px;display:flex;flex-direction:column;gap:7px;position:relative;overflow:hidden}
.kiosk.hard .screen-in{font-size:10px;filter:blur(.4px);letter-spacing:-.01em}
.kiosk.hard .kb{background:#2A3441;color:#E9EEF3;border-radius:4px;padding:6px 7px;font-size:10px;text-align:left;line-height:1.3;border:1px solid #3A4553}
.kiosk.hard .kb.on{border-color:#F59E0B;background:#3A3320}
.kiosk.hard .kb.primary{background:#F59E0B;color:#111}
.kiosk.hard .kb.tiny{font-size:8.5px;padding:3px 6px;color:#9AA6B3}
.kiosk .grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:5px}
.kiosk .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.kiosk .khead{display:flex;justify-content:space-between;font-size:8.5px;color:#9AA6B3;text-transform:uppercase;letter-spacing:.08em}
.kiosk .ktitle{font-size:12.5px;font-weight:700;color:#fff}
.kiosk .ad{position:absolute;inset:0;background:linear-gradient(160deg,#F59E0B,#DC2626 60%,#7C2D12);border-radius:8px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:8px;padding:18px;text-align:center;color:#fff;font-family:var(--body)}
.kiosk .ad .big{font-size:26px;font-weight:900;line-height:1.1;text-shadow:0 2px 6px rgba(0,0,0,.4);font-family:var(--display)}
.kiosk .ad .x{position:absolute;top:6px;right:8px;width:15px;height:15px;border-radius:50%;background:rgba(255,255,255,.25);color:#fff;font-size:9px;display:grid;place-items:center}
.kiosk .ad .fake{margin-top:8px;background:#fff;color:#B91C1C;font-weight:800;padding:9px 20px;border-radius:999px;font-size:14px}
.kiosk .footerbar{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:6px;border-top:1px solid #3A4553;padding-top:7px}
.kiosk .kpad{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;max-width:170px;margin:0 auto}
.kiosk .kpad .kb{text-align:center}
.kiosk .opt{display:flex;justify-content:space-between;align-items:center;gap:6px;border-bottom:1px dashed #3A4553;padding:4px 0}
.kiosk .opt .grp{display:flex;gap:4px}
.kiosk .cardslot{margin-top:auto;border:2px dashed #9AA6B3;border-radius:6px;padding:10px;text-align:center;font-size:11px;color:#9AA6B3}
.kiosk.easy .screen-in{font-size:18px;gap:12px;font-family:var(--body)}
.kiosk.easy .kb{background:#fff;color:#111;border-radius:12px;padding:16px 10px;font-size:21px;font-family:var(--display);text-align:center;line-height:1.2;border:3px solid transparent}
.kiosk.easy .kb small{font-size:14px;font-family:var(--body)}
.kiosk.easy .ktitle{font-size:22px;font-family:var(--display);text-align:center;font-weight:400}
.kiosk.easy .help{margin-top:auto;font-size:14px;color:#9AA6B3;text-align:center}
.kiosk.easy .cardslot{font-size:15px;padding:16px}

/* shop */
.shopres{position:absolute;inset:52px 40px 172px;display:grid;grid-template-columns:400px 1fr;gap:18px}
.ledger{background:var(--panel);border:1px solid var(--panel-line);padding:8px 16px 10px;font-variant-numeric:tabular-nums;align-self:start}
.ledger .h{font-family:var(--display);font-size:19px;border-bottom:1px solid var(--panel-line);padding-bottom:4px;margin-bottom:2px;display:flex;justify-content:space-between}
.ledger .li{display:flex;justify-content:space-between;gap:12px;padding:3px 0;border-bottom:1px dashed rgba(255,255,255,.1);font-size:14px}
.ledger .li.total{font-family:var(--display);font-size:21px;border-top:2px solid var(--gold);border-bottom:0;margin-top:3px;padding-top:6px;color:var(--gold)}
.ledger .neg{color:var(--pro)}.ledger .pos{color:var(--ok)}.ledger .zero{color:var(--muted)}
.events{display:flex;flex-direction:column;gap:8px;align-self:start}
.ev{display:flex;gap:10px;align-items:flex-start;background:var(--panel);border:1px solid var(--panel-line);padding:10px 12px;font-size:14.5px;animation:fadeup .4s both}
.ev:nth-child(2){animation-delay:.25s}.ev:nth-child(3){animation-delay:.5s}
.ev .ic{font-size:20px;flex-shrink:0}
.compare{display:flex;gap:8px;margin-top:4px}
.compare .c{flex:1;background:var(--panel);border:1px solid var(--panel-line);padding:8px;text-align:center}
.compare .c .n{font-family:var(--display);font-size:22px;color:var(--gold)}
.compare .c .l{font-size:12px;color:var(--muted)}

/* notes */
.notes{position:absolute;inset:56px 40px 24px;background:var(--panel);border:1px solid var(--panel-line);display:flex;flex-direction:column}
.tabs{display:flex;border-bottom:1px solid var(--panel-line)}
.tabs button{font-family:var(--display);font-size:17px;padding:10px 20px;color:var(--muted);border-bottom:3px solid transparent;letter-spacing:.03em}
.tabs button.on{color:var(--gold);border-bottom-color:var(--gold)}
.tabs .sp{flex:1}
.tabs .close{color:var(--ink)}
.nbody{flex:1;overflow:auto;padding:14px 18px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.col h3{font-family:var(--display);font-weight:400;font-size:19px;margin:0 0 8px;padding:6px 10px;display:flex;justify-content:space-between}
.col.pro h3{background:var(--pro-bg);color:var(--pro)}.col.con h3{background:var(--con-bg);color:var(--con)}
.col .list{display:flex;flex-direction:column;gap:6px}
.pick{display:flex;gap:10px;align-items:flex-start;background:rgba(255,255,255,.04);border:1px solid var(--panel-line);padding:8px 10px;text-align:left;width:100%}
.pick.on{border-color:var(--gold);background:rgba(242,193,78,.1)}
.pick .box{width:20px;height:20px;border:2px solid var(--panel-line);flex-shrink:0;margin-top:2px;display:grid;place-items:center;font-size:13px}
.pick.on .box{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.pick .who{font-size:11.5px;color:var(--muted)}
.pick .tt{font-family:var(--display);font-size:16px;line-height:1.2}
.pick .tx{font-size:12.5px;line-height:1.45;color:#C9D2DD}
.pick .bm{color:var(--both);font-family:var(--display);font-size:11px}
.empty{padding:14px;border:1px dashed var(--panel-line);color:var(--muted);font-size:14px;text-align:center}
.stance{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stance button{padding:12px;border:2px solid var(--panel-line);font-family:var(--display);font-size:20px;background:rgba(255,255,255,.03)}
.stance .pro.on{border-color:var(--pro);background:var(--pro-bg);color:var(--pro)}
.stance .con.on{border-color:var(--con);background:var(--con-bg);color:var(--con)}
.field label{display:block;font-family:var(--display);color:var(--gold);font-size:14px;margin-bottom:4px;letter-spacing:.04em}
textarea{font:inherit;font-size:14px;width:100%;background:#0A0F16;color:var(--ink);border:1px solid var(--panel-line);padding:8px 10px;resize:vertical;min-height:70px}
.out{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;min-height:180px;line-height:1.5}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.gbtn{font-family:var(--display);font-size:16px;background:var(--gold);color:var(--gold-ink);padding:8px 18px;clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%)}
.gbtn.ghost{background:rgba(255,255,255,.08);color:var(--ink);border:1px solid var(--panel-line);clip-path:none}
.rotate{position:fixed;inset:0;background:#07090D;color:#fff;display:none;place-items:center;text-align:center;font-family:var(--display);font-size:22px;z-index:50;padding:20px}
@media (orientation:portrait) and (max-width:700px){.rotate{display:grid}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</head>
<body>
<div id="root"><div id="stage">
  <div class="layer" id="bg"></div>
  <div class="layer" id="content"></div>
  <div class="layer" id="hud"></div>
  <div class="layer" id="menu"></div>
  <div class="layer" id="dlg"></div>
  <div class="layer" id="popup"></div>
</div></div>
<div class="rotate">📱↻<br>화면을 가로로 돌려 주세요<br><span style="font-size:15px;color:#AAB6C6;font-family:var(--body)">키오스크 마을은 가로 화면용 게임이에요</span></div>

/* ---------- 상태 ---------- */
const KEY='kiosk-village-v2';
let S = load() || fresh(); S.side=S.side||{}; S.wrong=S.wrong||0;
function fresh(){ return {agreed:false, asked:{}, cards:[], side:{}, wrong:0, exp:{}, kioskFails:0, shopTried:[], picks:{pro:[],con:[]}, stance:'', reason:''}; }
function load(){ try{ const r=localStorage.getItem(KEY); return r?JSON.parse(r):null; }catch(e){ return null; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

const ALL_CARDS = (()=>{ const m={}; NPCS.forEach(n=>n.qs.forEach((q,i)=>{ m[n.id+'-'+i]=Object.assign({who:n.name+' · '+n.role}, q.card); })); Object.keys(EXP_CARDS).forEach(k=>m[k]=EXP_CARDS[k]); return m; })();
const TOTAL = Object.keys(ALL_CARDS).length;
const npcById = id => NPCS.find(n=>n.id===id);
const askedCount = n => n.qs.filter((_,i)=>S.asked[n.id+'-'+i]).length;
const npcDone = n => askedCount(n)===n.qs.length;
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const myName = () => '나';

/* ---------- 레이어 ---------- */
const L = {}; ['bg','content','hud','menu','dlg','popup'].forEach(id=>L[id]=document.getElementById(id));
const stage = document.getElementById('stage');
function fit(){ const s=Math.min(innerWidth/960, innerHeight/540); stage.style.transform=`scale(${s})`; }
addEventListener('resize',fit); fit();

let cur = {screen:'title'}; let tmp = {};
function setBg(src, cls){ L.bg.className='layer '+(cls||''); L.bg.innerHTML = src?`<img src="${src}" alt=""><div class="dim"></div>`:''; }
function setContent(h){ L.content.innerHTML=h||''; }
function setHud(loc, extra){ L.hud.innerHTML = loc==null?'':`<div class="hud-loc">📍 ${esc(loc)}</div><div class="hud-right">${extra||''}<div class="hud-cards">🃏 <b>${S.cards.length}</b> / ${TOTAL}</div><button class="hud-btn" data-action="notes">조사 노트</button></div>`; }
function setMenu(items, title, bottom){
  if(!items){ L.menu.innerHTML=''; return; }
  L.menu.innerHTML = `<div class="mlist ${bottom?'bottom':''}">${title?`<div class="mtitle">${esc(title)}</div>`:''}${items.map(it=>`<button class="mi ${it.cls||''}" data-action="${it.action}" ${Object.entries(it.data||{}).map(([k,v])=>`data-${k}="${esc(v)}"`).join(' ')} ${it.disabled?'disabled':''}>${it.label}</button>`).join('')}</div>`;
}
function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; stage.appendChild(t); setTimeout(()=>t.remove(),1500); }

/* 대사 시스템 */
let typer=null;
function say(lines, done){ tmp.dlg={lines, i:0, done}; showLine(); }
function showLine(){
  const d=tmp.dlg; if(!d) return; const l=d.lines[d.i];
  const face = l.face ? `<img class="face" src="${l.face}" alt="">` : '';
  L.dlg.innerHTML = `<div class="dbox" data-action="next"><span class="name ${l.me?'me':''}">${esc(l.name)}</span>${face}<div class="dtext"></div><span class="next">▼ 계속</span></div>`;
  const el=L.dlg.querySelector('.dtext'); const full=l.text; let i=0;
  clearInterval(typer);
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduced){ el.textContent=full; d.typing=false; return; }
  d.typing=true;
  typer=setInterval(()=>{ i++; el.textContent=full.slice(0,i); if(i>=full.length){ clearInterval(typer); d.typing=false; } },22);
}
function next(){
  const d=tmp.dlg; if(!d) return;
  if(d.typing){ clearInterval(typer); L.dlg.querySelector('.dtext').textContent=d.lines[d.i].text; d.typing=false; return; }
  d.i++;
  if(d.i>=d.lines.length){ tmp.dlg=null; L.dlg.innerHTML=''; d.done&&d.done(); } else showLine();
}
function clearDlg(){ clearInterval(typer); tmp.dlg=null; L.dlg.innerHTML=''; }
const npcLines = (n, arr) => arr.map(t=>({name:n.name, text:t, face:IMG[n.id].face}));
const meLine = t => ({name:myName(), text:t, me:true});

function awardCard(id, then){
  if(S.cards.includes(id)){ then&&then(); return; }
  S.cards.push(id); save(); if(cur.loc!=null) setHud(cur.loc, cur.hudExtra);
  tmp.popThen = then; tmp.popId = id; renderCardPop(id, 'choose');
}
function cardBody(c, hideArrow){
  const text = hideArrow ? c.text.split(' → ')[0] : c.text;
  return `<div class="body"><div class="got">✦ 새 카드 획득 ${S.cards.length}/${TOTAL}</div><h3>${esc(c.title)}</h3><p>${esc(text)}</p><div class="who">${esc(c.who)}</div></div>`;
}
function renderCardPop(id, mode, wrong){
  const c=ALL_CARDS[id];
  if(mode==='choose'){
    L.popup.innerHTML = `<div class="cardpop neutral"><div class="band"><span>쟁점 카드</span><span>어느 쪽 근거일까?</span></div>${cardBody(c,true)}<div class="ask">이 이야기는 <b>"${esc(MOTION)}"</b>는 주장을 도와줄까, 반대할까? 네가 판단해서 넣어 봐.</div><div class="choose"><button class="pb" data-action="side" data-val="pro">찬성 근거로</button><button class="cb" data-action="side" data-val="con">반대 근거로</button></div>${wrong?`<div class="hint">잠깐! 한 번 더 신중하게 생각해 봐. 이 사람의 말이 <b>"설치를 법으로 제한해야 한다"</b>는 쪽에 힘을 실어 줄까, 아니면 그 반대일까?</div>`:''}</div>`;
    if(wrong){ clearTimeout(tmp.hintT); tmp.hintT=setTimeout(()=>{ const el=L.popup.querySelector('.hint'); if(el) el.remove(); },3500); }
  } else {
    const side=S.side[id]; const label = side==='pro'?'찬성 근거로 정리했어':'반대 근거로 정리했어';
    const note = c.side==='both' ? `<div class="note">이 카드는 사실 양쪽 다 쓸 수 있는 카드야. 네 판단대로 넣었어. ${c.text.includes(' → ')?esc('→ '+c.text.split(' → ')[1]):''} 조사 노트에서 옮길 수도 있어.</div>` : '';
    L.popup.innerHTML = `<div class="cardpop ${side}"><div class="band"><span>쟁점 카드</span><span>${label}</span></div>${cardBody(c,true)}${note}<div class="foot" data-action="popclose">확인 ▶</div></div>`;
  }
}
function chooseSide(val){
  const id=tmp.popId; const c=ALL_CARDS[id]; if(!id) return;
  if(c.side==='both' || c.side===val){ S.side[id]=val; save(); renderCardPop(id,'done'); }
  else { S.wrong++; save(); renderCardPop(id,'choose',true); }
}
function popclose(){ L.popup.innerHTML=''; const t=tmp.popThen; tmp.popThen=null; t&&t(); }

function showVillage(){

/* 대화 */
function startTalk(id){
  const n=npcById(id); cur={screen:'talk', npc:id, loc:n.place}; setMenu(null); L.popup.innerHTML='';
  setBg(IMG[n.id].scene,''); setHud(n.place); setContent('');
  say(npcLines(n, n.intro), ()=>talkMenu(n));
}
function talkMenu(n){
  const items = n.qs.map((q,i)=>({label:esc(q.q), action:'ask', data:{i}, cls:S.asked[n.id+'-'+i]?'asked':''}));
  if(n.exp && npcDone(n) && S.exp[n.exp]!=='done') items.push({label:'▶ '+n.expLabel, action:'exp', data:{exp:n.exp}, cls:'exp'});
  items.push({label:'← 마을로 돌아가기', action:'village', cls:'sub'});
  setMenu(items, npcDone(n)?'다 물어봤어 · 다시 들어볼 수도 있어':'무엇을 물어볼까?', true);
}
function ask(i){
  const n=npcById(cur.npc); const q=n.qs[i]; setMenu(null);
  say([meLine(q.q), ...npcLines(n,q.a)], ()=>{
    S.asked[n.id+'-'+i]=true; save();
    awardCard(n.id+'-'+i, ()=>{
      if(n.exp && npcDone(n) && S.exp[n.exp]!=='done' && !tmp['hint-'+n.exp]){ tmp['hint-'+n.exp]=true; say(npcLines(n,[n.id==='grandma'?'…학생, 말로만 들어선 몰라. 한 번 내가 되어서 주문해 볼래?':'말로만 하면 모르죠. 한 달만 제 대신 가게 운영해 볼래요?']), ()=>talkMenu(n)); }
      else talkMenu(n);
    });
  });
}

let timerId=null; function stopTimer(){ if(timerId){clearInterval(timerId);timerId=null;} }
function startKiosk(){
  cur={screen:'kiosk', loc:'카페 키오스크 앞'}; setMenu(null); setContent(''); setBg(IMG.parttimer.scene,'heavy'); setHud(cur.loc);
  const g=npcById('grandma');
  say([...npcLines(g,['자, 이제 네가 나야. 눈은 침침하고 영어는 잘 모르고, 뒤에는 점심시간 줄이 서 있어.','따뜻한 아메리카노 한 잔, 여기서 마시고 갈 거야. 카드로 계산하고.']), {name:'안내', text:'45초 안에 주문을 끝내야 해. 실패해도 괜찮아. 그게 이 체험의 핵심이니까.'}], ()=>kioskInit('hard'));
}
function kioskInit(mode){
  tmp.k={mode, step:mode==='hard'?'ad':'cat', lang:'en', temp:'ICED', size:'Tall', place:null, time:mode==='hard'?45:0, phase:'play', msg:''};
  stopTimer(); clearDlg(); setMenu(null); L.popup.innerHTML='';
  if(mode==='hard'){ timerId=setInterval(()=>{ const k=tmp.k; if(!k||k.phase!=='play') return; k.time--; if(k.time===20) k.msg='뒤에서 누가 한숨을 쉰다…'; if(k.time===10) k.msg='"저기요, 빨리 좀 해 주세요."'; if(k.time<=0){ stopTimer(); kioskEnd(false,'시간 초과. 뒤에 줄이 길어져서 할머니는 주문을 포기하고 가게를 나섰다.'); return; } kioskRender(); },1000); }
  kioskRender();
}
function kioskRender(){
  const k=tmp.k; if(!k) return;
  const hard=k.mode==='hard';
  setHud(cur.loc, hard?`<div class="hud-timer ${k.time<=15?'hurry':''}">⏱ ${k.time}</div>`:'');
  setContent(`<div class="kwrap"><div class="kside"><div class="mission"><div class="l">MISSION</div><div class="t">따뜻한 아메리카노 1잔<br>매장에서 · 카드 결제</div></div><div class="think">${esc(k.msg)}</div><div class="note">${hard?'화면이 흐릿하고 글씨가 작은 건 일부러야. 76세의 눈으로 보는 키오스크.':'디자이너 최다은 씨가 말한 "선택지 3개, 한국어, 큰 글씨" 화면이야. 시간 제한 없음.'}</div><button class="gbtn ghost" data-action="kiosk-quit" style="align-self:flex-start">체험 그만두기</button></div><div class="kiosk ${k.mode}"><div class="screen-in">${hard?hardScreen(k):easyScreen(k)}</div></div></div>`);
}

    <div class="li"><span>임대료</span><span class="neg">−${SHOP.rent}만 원</span></div>

    <div class="li"><span>키오스크 렌탈 (${o.kiosk}대 × 12만)</span><span class="${kiosk?'neg':'zero'}">${kiosk?'−'+kiosk:'0'}만 원</span></div>
    <div class="li"><span>한 달 동안 생긴 일</span><span class="${evSum<0?'neg':'pos'}">${fmt(evSum)}</span></div>

  const own=npcById('owner');
  say(npcLines(own,[o.quote]), ()=>awardCard('shop-con', ()=>awardCard('shop-pro', ()=>setMenu([{label:'▶ 다른 선택도 해 보기', action:'shop-again', cls:'exp'},{label:'← 마을로 돌아가기', action:'village', cls:'sub'}], null, true))));

  const col=(side,list)=>`<div class="col ${side}"><h3><span>${side==='pro'?'찬성 근거':'반대 근거'}</span><span style="font-size:14px">${S.picks[side].length}/3 선택</span></h3><div class="list">${list.length?list.map(c=>pickHTML(c,side)).join(''):'<div class="empty">아직 모은 카드가 없어. 마을에서 사람들을 만나 봐.</div>'}</div></div>`;

      <div class="field"><label for="reason">그렇게 생각한 이유 (마을에서 만난 사람 이름을 넣어서)</label><textarea id="reason" placeholder="예) 박순자 할머니처럼 주문을 포기하는 사람이 있는데, 김영호 사장님 말대로 가게가 스스로 바꾸지는 않을 것 같아서…">${esc(S.reason)}</textarea></div>
      <div class="field" style="margin-top:12px"><label>Padlet에 붙일 글 · 쟁점 요약하기</label>${ready?`<textarea class="out" id="out" readonly>${esc(buildOutput())}</textarea><div class="row" style="margin-top:8px"><button class="gbtn" data-action="copy">복사하기</button><span style="font-size:12.5px;color:var(--muted)">복사가 안 되면 글상자를 눌러 전체 선택 후 복사해.</span></div>`:`<div class="empty">카드 고르기에서 찬성 또는 반대 근거를 3개 고르면 여기에 글이 만들어져.</div>`}</div>`;
  }
  setContent(`<div class="notes"><div class="tabs"><button class="${tmp.ntab==='cards'?'on':''}" data-action="ntab" data-tab="cards">① 카드 고르기</button><button class="${tmp.ntab==='final'?'on':''}" data-action="ntab" data-tab="final">② 내 입장 · 정리 ${ready?'':'🔒'}</button><span class="sp"></span><button class="close" data-action="village">✕ 마을로</button></div><div class="nbody">${body}</div></div>`);
}
function buildOutput(){
  const line=side=>S.picks[side].length?S.picks[side].map((id,i)=>{const c=ALL_CARDS[id];return `${i+1}. ${c.title} — ${c.text.split(' → ')[0]} (${c.who})`;}).join('\n'):'(아직 고르지 않음)';
  const st=S.stance==='pro'?'찬성':S.stance==='con'?'반대':'(아직 정하지 않음)';
  return `[쟁점 요약하기] 학번 이름: (직접 입력하세요)\n논제: ${MOTION}\n\n■ 찬성 주장 (설치를 제한해야 한다)\n${line('pro')}\n\n■ 반대 주장 (제한하면 안 된다)\n${line('con')}\n\n■ 내 입장: ${st}\n${S.reason||''}`.trim();
}
function fallbackCopy(done){ const o=document.getElementById('out'); if(!o) return; o.focus(); o.select(); try{ document.execCommand('copy'); done(); }catch(e){ toast('글상자를 직접 선택해서 복사해 줘'); } }

/* ---------- 이벤트 ---------- */
stage.addEventListener('click', e=>{
  const b=e.target.closest('[data-action]'); if(!b) return;
  const a=b.dataset.action, d=b.dataset;
  switch(a){
    case 'next': next(); break;
    case 'popclose': popclose(); break;
    case 'side': chooseSide(d.val); break;
    case 'move': { const c=ALL_CARDS[d.id]; if(c.side!=='both'){ toast('이 카드는 옮길 수 없어'); return; } const now=S.side[d.id]||'pro'; S.side[d.id]=now==='pro'?'con':'pro'; ['pro','con'].forEach(s=>{const i=S.picks[s].indexOf(d.id); if(i>=0) S.picks[s].splice(i,1);}); save(); showNotes(); break; }
    case 'start': showVillage(); break;
    case 'privacy': showPrivacy(); break;
    case 'agree': tmp.agree=!tmp.agree; showGate(); break;
    case 'gate-ok': if(!tmp.agree) return; S.agreed=true; save(); showTitle(); break;
    case 'reset': { if(!tmp.confirmReset){ tmp.confirmReset=true; b.textContent='정말 지울까? 한 번 더 누르면 초기화'; return; } S=fresh(); tmp={}; save(); showGate(); break; }
    case 'village': stopTimer(); tmp.k=null; showVillage(); break;
    case 'notes': showNotes(); break;
    case 'ntab': showNotes(d.tab); break;
    case 'talk': startTalk(d.npc); break;
    case 'ask': ask(+d.i); break;
    case 'exp': d.exp==='kiosk'?startKiosk():startShop(); break;
    case 'kiosk-start': kioskInit(d.mode); break;
    case 'kiosk-quit': stopTimer(); tmp.k=null; showVillage(); break;
    case 'k': { const k=tmp.k; if(d.lang) k.lang=d.lang; k.step=d.step; kioskRender(); break; }
    case 'k-ad': tmp.k.msg='광고를 눌렀다. 밀크티 화면이 열렸다가 닫혔다. 5초가 날아갔다.'; tmp.k.time=Math.max(1,tmp.k.time-5); kioskRender(); break;
    case 'k-set': { const k=tmp.k; if(d.key==='temp'||d.key==='size') k[d.key]=d.val; else k.msg='필요 없는 옵션을 눌렀다. 값이 올랐다…'; kioskRender(); break; }
    case 'k-key': tmp.k.msg='휴대폰 번호를 누르기 시작했다… 이게 꼭 필요한 걸까?'; tmp.k.time=Math.max(1,tmp.k.time-2); kioskRender(); break;
    case 'k-place': tmp.k.place=d.val; tmp.k.step='pay'; kioskRender(); break;
    case 'k-fail': kioskEnd(false, d.why); break;
    case 'k-finish': { const k=tmp.k; const ok=k.temp==='HOT'&&k.place==='in'; if(ok) kioskEnd(true); else kioskEnd(false, k.temp!=='HOT'?'결제는 됐지만 차가운 아메리카노가 나왔다. "뜨거운 거 시켰는데…" 할머니는 다시 줄을 설 엄두가 안 났다.':'결제는 됐지만 포장으로 찍혀 종이컵에 담겨 나왔다. 앉아서 드시려던 할머니는 그냥 들고 나갔다.'); break; }
    case 'k-easy-temp': tmp.k.temp=d.val; tmp.k.step='place'; kioskRender(); break;
    case 'k-easy-place': tmp.k.place=d.val; tmp.k.step='pay'; kioskRender(); break;
    case 'k-easy-finish': kioskEnd(true); break;
    case 'shop-pick': shopResult(d.id); break;
    case 'shop-again': setContent(''); clearDlg(); shopMenu(); break;
    case 'pick': { const arr=S.picks[d.side]; const i=arr.indexOf(d.id); if(i>=0) arr.splice(i,1); else { if(arr.length>=3){ toast('3개까지만 고를 수 있어'); return; } arr.push(d.id); } save(); showNotes(); break; }
    case 'stance': S.stance=d.val; save(); showNotes(); break;
    case 'copy': { const txt=buildOutput(); const done=()=>toast('복사했어. Padlet에 붙여 넣자!'); try{ navigator.clipboard.writeText(txt).then(done,()=>fallbackCopy(done)); }catch(err){ fallbackCopy(done); } break; }
  }
});
stage.addEventListener('input', e=>{
  if(e.target.id==='reason'){ S.reason=e.target.value; save(); const o=document.getElementById('out'); if(o) o.value=buildOutput(); }
});
addEventListener('keydown', e=>{
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA') return;
  if(e.key===' '||e.key==='Enter'){ if(L.popup.innerHTML){ if(L.popup.querySelector('.foot')){ e.preventDefault(); popclose(); } } else if(tmp.dlg){ e.preventDefault(); next(); } }
});

if(S.agreed) showTitle(); else showGate();
})();
</script>
