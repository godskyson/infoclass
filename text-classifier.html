<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>텍스트 분류 모델 만들기</title>
<meta name="description" content="예시 문장으로 나만의 텍스트 분류 모델을 학습시키고 테스트하는 수업용 웹앱">
<meta name="theme-color" content="#eef0eb">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root {
    --ink: #1c1d21; --muted: #55585f; --paper: #eef0eb; --surface: #fff; --field: #fafaf7;
    --accent: #ffd23f; --ok: #c8f08f;
    /* 클래스 색: 입력 카드, 학습 칸, 결과 막대에서 같은 클래스는 같은 색 */
    --c0: #ff9fb8; --c1: #8fd8ea; --c2: #bfe88a; --c3: #c4b2ff; --c4: #ffb37a; --c5: #9fe0c4;
    --line: 2px solid var(--ink);
    --shadow-sm: 3px 3px 0 var(--ink); --shadow: 5px 5px 0 var(--ink); --shadow-lg: 7px 7px 0 var(--ink);
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  }
  * { box-sizing: border-box; }
  body { margin: 0; color: var(--ink); background-color: var(--paper);
    /* 모눈종이 배경 */
    background-image:
      linear-gradient(rgba(28, 29, 33, .06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(28, 29, 33, .06) 1px, transparent 1px);
    background-size: 24px 24px;
    font-family: "Pretendard Variable", Pretendard, "Malgun Gothic", system-ui, sans-serif;
    font-weight: 400; line-height: 1.6; -webkit-font-smoothing: antialiased; }
  main { max-width: 720px; margin: 0 auto; padding: 40px 16px 72px; }

  header h1 { display: inline-block; margin: 0; font-size: 1.75rem; font-weight: 700; letter-spacing: -0.02em;
    line-height: 1.3; background: var(--accent); border: var(--line); box-shadow: var(--shadow);
    padding: 4px 14px; transform: rotate(-1deg); }
  header p { margin: 14px 0 0; color: var(--muted); }

  /* ----- 진행 표시줄 ----- */
  .stepper { display: flex; align-items: flex-start; margin: 32px 0 24px; padding: 0; list-style: none; }
  .stepper .item { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 72px; }
  .stepper .dot { width: 36px; height: 36px; display: grid; place-items: center; font-weight: 600;
    font-variant-numeric: tabular-nums; background: var(--surface); border: var(--line); box-shadow: 2px 2px 0 var(--ink);
    transition: background-color .2s ease, transform .3s var(--ease-out), box-shadow .3s var(--ease-out); }
  .stepper .label { font-size: .8125rem; color: var(--muted); white-space: nowrap; }
  .stepper .bar { flex: 1; height: 4px; margin-top: 16px; background: var(--surface); border: 1.5px solid var(--ink);
    position: relative; overflow: hidden; }
  .stepper .bar::after { content: ''; position: absolute; inset: 0; background: var(--ink);
    transform: scaleX(0); transform-origin: left; transition: transform .4s var(--ease-out); }
  .stepper .bar.done::after { transform: scaleX(1); }
  .stepper .item.active .dot { background: var(--accent); transform: translate(-2px, -2px); box-shadow: var(--shadow-sm); }
  .stepper .item.active .label { color: var(--ink); font-weight: 600; }
  .stepper .item.done .dot { background: var(--ink); color: var(--surface); }

  /* ----- 화면 전환 ----- */
  .screen { display: none; background: var(--surface); border: var(--line); box-shadow: var(--shadow-lg);
    padding: 28px 28px 32px; }
  .screen.show { display: block; animation: enter .32s var(--ease-out) both; }
  .screen.show.back { animation-name: enter-back; }
  .screen.leave { display: block; animation: leave .18s ease-in both; }
  .screen.leave.back { animation-name: leave-back; }
  @keyframes enter { from { opacity: 0; transform: translateX(24px); } }
  @keyframes enter-back { from { opacity: 0; transform: translateX(-24px); } }
  @keyframes leave { to { opacity: 0; transform: translateX(-24px); } }
  @keyframes leave-back { to { opacity: 0; transform: translateX(24px); } }

  h2 { font-size: 1.375rem; font-weight: 700; letter-spacing: -0.015em; line-height: 1.35; margin: 0 0 6px; text-wrap: balance; }
  .sub { color: var(--muted); margin: 0 0 22px; max-width: 60ch; }
  .sub strong { color: var(--ink); font-weight: 600; }
  .field-label { display: block; font-size: .875rem; font-weight: 500; margin-bottom: 6px; }

  input[type=text], textarea { width: 100%; padding: 10px 12px; border: var(--line); border-radius: 0;
    font: inherit; color: var(--ink); background: var(--field);
    transition: box-shadow .15s ease, transform .15s ease, background-color .15s ease; }
  input::placeholder, textarea::placeholder { color: #80838a; }
  textarea { resize: vertical; min-height: 84px; display: block; }
  input:focus-visible, textarea:focus-visible { outline: none; background: var(--surface);
    box-shadow: var(--shadow-sm); transform: translate(-2px, -2px); }
  .big-input { font-size: 1.125rem; padding: 12px 14px; font-weight: 500; }

  /* ----- 클래스 카드 ----- */
  .class-list { display: grid; gap: 18px; margin-bottom: 18px; }
  .class-card { --cc: var(--c0); border: var(--line); box-shadow: var(--shadow-sm); background: var(--surface); }
  .class-head { display: flex; gap: 8px; align-items: center; padding: 10px; background: var(--cc); border-bottom: var(--line); }
  .class-head input { flex: 1; font-weight: 600; background: var(--surface); }
  .class-card textarea { border: none; background: var(--surface); }
  .class-card textarea:focus-visible { box-shadow: inset 0 0 0 2px var(--ink); transform: none; }
  .count { display: flex; justify-content: space-between; font-size: .8125rem; padding: 5px 12px;
    border-top: 1.5px dashed var(--ink); font-variant-numeric: tabular-nums; }
  .count.bad { color: #b42318; }
  .count.good { background: var(--ok); border-top-style: solid; font-weight: 500;
    transition: background-color .2s ease; }

  /* ----- 버튼 ----- */
  button { font: inherit; font-weight: 600; color: var(--ink); border: var(--line); border-radius: 0;
    padding: 10px 18px; cursor: pointer; white-space: nowrap; background: var(--surface); box-shadow: var(--shadow-sm);
    transition: transform .12s ease-out, box-shadow .12s ease-out, background-color .15s ease;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  button:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  button:active { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--ink); }
  @media (hover: hover) and (pointer: fine) {
    button:hover { transform: translate(-1px, -1px); box-shadow: 4px 4px 0 var(--ink); }
    button:active { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--ink); }
  }
  .btn-primary { background: var(--accent); }
  .btn-text { border-color: transparent; box-shadow: none; background: none; padding-inline: 6px; color: var(--muted); font-weight: 500; }
  .btn-text:active, .btn-text:hover { box-shadow: none !important; transform: none !important; color: var(--ink);
    text-decoration: underline; text-underline-offset: 3px; }
  .btn-del { padding: 4px 10px; font-weight: 500; box-shadow: none; background: var(--surface); }
  .btn-add { width: 100%; border-style: dashed; box-shadow: none; background: transparent; font-weight: 500; }

  .nav { display: flex; justify-content: space-between; align-items: center; margin-top: 28px; gap: 8px; }
  .msg { margin-top: 16px; font-size: .9375rem; }
  .msg:empty { display: none; }
  .msg.err { background: #ffe1dc; border: var(--line); padding: 8px 12px; }
  .shake { animation: shake .3s ease-out; }
  @keyframes shake { 25% { transform: translateX(-5px); } 50% { transform: translateX(5px); } 75% { transform: translateX(-2px); } }

  /* ----- 학습 화면 ----- */
  .train-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .train-pct { font-size: 1.375rem; font-weight: 600; font-variant-numeric: tabular-nums; }
  .progress { height: 22px; background: var(--surface); border: var(--line); overflow: hidden; margin: 14px 0 8px; }
  .progress > span { display: block; height: 100%; width: 100%; transform: scaleX(0); transform-origin: left;
    background: repeating-linear-gradient(-45deg, var(--accent) 0 10px, #f2c21c 10px 20px); }
  .status { color: var(--muted); font-size: .9375rem; min-height: 1.6em; }
  .bins { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; margin-top: 22px; }
  .bin { border: var(--line); background: var(--surface); min-height: 116px; display: flex; flex-direction: column; }
  .bin-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 6px 10px;
    background: var(--cc); border-bottom: var(--line); font-weight: 600; overflow-wrap: anywhere; }
  .bin-head .n { font-weight: 500; font-size: .8125rem; font-variant-numeric: tabular-nums; }
  .bin-body { display: flex; flex-wrap: wrap; gap: 6px; align-content: flex-start; padding: 10px; }
  .chip { font-size: .8125rem; padding: 1px 8px; border: 1.5px solid var(--ink); background: var(--cc);
    animation: drop .28s var(--ease-out) both; }
  @keyframes drop { from { opacity: 0; transform: translateY(-10px) scale(.95); } }
  .train-done { font-weight: 600; }

  /* ----- 테스트 화면 ----- */
  .model-name { font-weight: 600; color: var(--ink); background: var(--accent); padding: 0 6px; }
  .test-row { display: flex; gap: 10px; }
  .test-row input { flex: 1; min-width: 0; }
  .result { margin-top: 24px; border: var(--line); background: var(--field); padding: 18px 18px 14px; }
  .result:empty { display: none; }
  .result-top { display: flex; align-items: baseline; gap: 10px; margin: 0 0 14px; font-size: 1rem; font-weight: 500; }
  .result-top b { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.01em; background: var(--cc);
    border: var(--line); padding: 0 10px; animation: drop .3s var(--ease-out) both; }
  .bar-row { display: grid; grid-template-columns: minmax(0, 96px) 1fr 58px; gap: 10px; align-items: center; margin: 8px 0; }
  .bar-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
  .bar { height: 20px; border: 1.5px solid var(--ink); background: var(--surface); overflow: hidden; }
  .bar > span { display: block; height: 100%; width: 100%; background: var(--cc); border-right: 1.5px solid var(--ink);
    transform: scaleX(0); transform-origin: left; transition: transform .5s var(--ease-out); }
  .pct { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
  .result-hint { margin: 12px 0 0; font-size: .8125rem; color: var(--muted); }

  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  @media (max-width: 520px) {
    main { padding-top: 28px; }
    header h1 { font-size: 1.4rem; }
    .stepper .item { width: 58px; }
    .stepper .label { font-size: .75rem; }
    .screen { padding: 20px 18px 24px; box-shadow: var(--shadow); }
    .test-row { flex-direction: column; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>텍스트 분류 모델 만들기</h1>
    <p>예시 문장으로 모델을 가르치고, 처음 보는 문장을 분류해 봐요.</p>
  </header>

  <ol class="stepper" id="stepper" aria-label="진행 단계">
    <li class="item"><div class="dot">1</div><div class="label">모델 이름</div></li>
    <li class="bar" aria-hidden="true"></li>
    <li class="item"><div class="dot">2</div><div class="label">데이터 입력</div></li>
    <li class="bar" aria-hidden="true"></li>
    <li class="item"><div class="dot">3</div><div class="label">학습</div></li>
    <li class="bar" aria-hidden="true"></li>
    <li class="item"><div class="dot">4</div><div class="label">테스트</div></li>
  </ol>

  <!-- 1. 모델 이름 -->
  <section class="screen" data-step="1" aria-labelledby="t1">
    <h2 id="t1">모델 이름 정하기</h2>
    <p class="sub">무엇을 분류하는 모델인지 알 수 있게 지어 주세요.</p>
    <label class="field-label" for="modelName">모델 이름</label>
    <input type="text" id="modelName" class="big-input" placeholder="예: 감정 분류기" value="감정 분류기" autocomplete="off">
    <div class="msg" id="nameMsg" role="alert"></div>
    <div class="nav">
      <span></span>
      <button class="btn-primary" id="toData">다음</button>
    </div>
  </section>

  <!-- 2. 데이터 입력 -->
  <section class="screen" data-step="2" aria-labelledby="t2">
    <h2 id="t2">학습 데이터 입력하기</h2>
    <p class="sub">클래스마다 예시 문장을 <strong>쉼표(,)</strong>로 구분해 <strong>5개 이상</strong> 넣어 주세요.</p>
    <div class="class-list" id="classes"></div>
    <button class="btn-add" id="addClass">클래스 추가</button>
    <div class="msg" id="trainMsg" role="alert"></div>
    <div class="nav">
      <button class="btn-text" id="backToName">이전</button>
      <button class="btn-primary" id="trainBtn">학습하기</button>
    </div>
  </section>

  <!-- 3. 학습 -->
  <section class="screen" data-step="3" aria-labelledby="trainTitle">
    <div class="train-head">
      <h2 id="trainTitle">학습하는 중</h2>
      <span class="train-pct" id="trainPct" aria-hidden="true">0%</span>
    </div>
    <div class="progress"><span id="progressBar"></span></div>
    <div class="status" id="status" aria-live="polite"></div>
    <div class="bins" id="bins"></div>
  </section>

  <!-- 4. 테스트 -->
  <section class="screen" data-step="4" aria-labelledby="t4">
    <h2 id="t4">모델 테스트하기</h2>
    <p class="sub"><span class="model-name" id="modelTag"></span> 학습이 끝났어요. 처음 보는 문장을 넣어 보세요.</p>
    <label class="field-label" for="testInput">분류할 문장</label>
    <div class="test-row">
      <input type="text" id="testInput" placeholder="예: 오늘 급식이 맛있었어" autocomplete="off">
      <button class="btn-primary" id="testBtn">분류하기</button>
    </div>
    <div class="result" id="result" aria-live="polite"></div>
    <div class="nav">
      <button class="btn-text" id="backToData">데이터 고치기</button>
      <button id="restart">처음부터</button>
    </div>
  </section>
</main>

<script>
// ----- 화면 전환 -----
const screens = [...document.querySelectorAll('.screen')];
const stepItems = [...document.querySelectorAll('#stepper .item')];
const stepBars = [...document.querySelectorAll('#stepper .bar')];
let current = 0;

function go(step) {
  const back = step < current;
  const prev = screens.find(s => s.classList.contains('show'));
  const next = screens.find(s => +s.dataset.step === step);
  current = step;

  stepItems.forEach((el, i) => {
    el.classList.toggle('active', i + 1 === step);
    el.classList.toggle('done', i + 1 < step);
    if (i + 1 === step) el.setAttribute('aria-current', 'step'); else el.removeAttribute('aria-current');
  });
  stepBars.forEach((el, i) => el.classList.toggle('done', i + 2 <= step));

  const show = () => {
    next.classList.remove('back');
    if (back) next.classList.add('back');
    next.classList.add('show');
    const focusEl = next.querySelector('input');
    if (focusEl) focusEl.focus({ preventScroll: true });
  };
  if (!prev) return show();
  prev.classList.remove('show');
  prev.classList.add('leave');
  if (back) prev.classList.add('back');
  setTimeout(() => { prev.classList.remove('leave', 'back'); show(); }, 180);
}

function showError(el, text) {
  el.textContent = text;
  el.className = 'msg err';
  el.classList.remove('shake');
  void el.offsetWidth; // 애니메이션 다시 시작
  el.classList.add('shake');
}

// ----- 클래스 입력 UI -----
const classesEl = document.getElementById('classes');
const MIN = 5;
const COLORS = 6;

function splitItems(text) {
  return text.split(',').map(s => s.trim()).filter(Boolean);
}

// 클래스 순서대로 색을 다시 매긴다 (삭제 후에도 색이 겹치지 않게)
function recolor() {
  [...classesEl.children].forEach((card, i) => card.style.setProperty('--cc', `var(--c${i % COLORS})`));
}

function addClass(name = '', data = '') {
  const card = document.createElement('div');
  card.className = 'class-card';
  card.innerHTML = `
    <div class="class-head">
      <input type="text" class="cname" placeholder="클래스 이름" aria-label="클래스 이름" autocomplete="off">
      <button class="btn-del" aria-label="클래스 삭제">삭제</button>
    </div>
    <textarea class="cdata" placeholder="문장1, 문장2, 문장3, 문장4, 문장5" aria-label="예시 문장"></textarea>
    <div class="count"><span class="n"></span><span class="hint"></span></div>`;
  card.querySelector('.cname').value = name;
  card.querySelector('.cdata').value = data;
  card.querySelector('.cdata').addEventListener('input', () => updateCount(card));
  card.querySelector('.btn-del').addEventListener('click', () => { card.remove(); recolor(); });
  classesEl.appendChild(card);
  recolor();
  updateCount(card);
  return card;
}

function updateCount(card) {
  const n = splitItems(card.querySelector('.cdata').value).length;
  const el = card.querySelector('.count');
  el.querySelector('.n').textContent = `문장 ${n}개`;
  el.querySelector('.hint').textContent = n < MIN ? `${MIN - n}개 더 필요해요` : '충분해요 ✓';
  el.classList.toggle('bad', n < MIN);
  el.classList.toggle('good', n >= MIN);
}

document.getElementById('addClass').addEventListener('click', () => addClass().querySelector('.cname').focus());

// 데모용 기본 데이터
addClass('긍정', '오늘 정말 행복해, 기분이 너무 좋다, 최고의 하루였어, 친구랑 놀아서 신난다, 맛있는 거 먹어서 좋아, 시험을 잘 봐서 기뻐');
addClass('부정', '너무 슬퍼, 오늘 기분이 별로야, 짜증나는 하루였다, 시험을 망쳐서 속상해, 비가 와서 우울하다, 친구랑 싸워서 화가 나');

// ----- 모델: 나이브 베이즈 (단어 + 글자 2-gram) -----
function tokenize(text) {
  const words = text.toLowerCase().replace(/[^\p{L}\p{N}\s]/gu, ' ').split(/\s+/).filter(Boolean);
  const tokens = [];
  for (const w of words) {
    tokens.push('w:' + w);
    // 한국어는 조사·어미가 붙으므로 글자 단위 조각도 특징으로 사용
    for (let i = 0; i < w.length; i++) {
      tokens.push('c:' + w[i]);
      if (i < w.length - 1) tokens.push('b:' + w.slice(i, i + 2));
    }
  }
  return tokens;
}

let model = null;

function train(dataset) {
  const vocab = new Set();
  const classes = dataset.map(({ label, texts }) => {
    const counts = new Map();
    let total = 0;
    for (const t of texts) {
      for (const tok of tokenize(t)) {
        counts.set(tok, (counts.get(tok) || 0) + 1);
        vocab.add(tok);
        total++;
      }
    }
    return { label, docs: texts.length, counts, total };
  });
  const totalDocs = classes.reduce((s, c) => s + c.docs, 0);
  return { classes, vocabSize: vocab.size, totalDocs };
}

function predict(m, text) {
  const toks = tokenize(text);
  const scores = m.classes.map(c => {
    let s = Math.log(c.docs / m.totalDocs);
    for (const tok of toks) {
      s += Math.log(((c.counts.get(tok) || 0) + 1) / (c.total + m.vocabSize));
    }
    return s;
  });
  // log 점수를 확률로 변환 (softmax)
  const max = Math.max(...scores);
  const exps = scores.map(s => Math.exp(s - max));
  const sum = exps.reduce((a, b) => a + b, 0);
  return m.classes
    .map((c, i) => ({ label: c.label, color: i % COLORS, prob: exps[i] / sum }))
    .sort((a, b) => b.prob - a.prob);
}

// ----- 1단계 → 2단계 -----
const modelNameEl = document.getElementById('modelName');
const nameMsg = document.getElementById('nameMsg');

function submitName() {
  if (!modelNameEl.value.trim()) return showError(nameMsg, '모델 이름을 입력해 주세요.');
  nameMsg.textContent = '';
  go(2);
}
document.getElementById('toData').addEventListener('click', submitName);
modelNameEl.addEventListener('keydown', e => { if (e.key === 'Enter') submitName(); });
document.getElementById('backToName').addEventListener('click', () => go(1));

// ----- 2단계 → 3단계(학습) → 4단계 -----
const trainMsg = document.getElementById('trainMsg');
const TRAIN_MS = 2000;

document.getElementById('trainBtn').addEventListener('click', () => {
  const cards = [...classesEl.querySelectorAll('.class-card')];
  const dataset = cards.map(c => ({
    label: c.querySelector('.cname').value.trim(),
    texts: splitItems(c.querySelector('.cdata').value),
  }));

  const unnamed = dataset.findIndex(d => !d.label);
  const dup = dataset.findIndex((d, i) => dataset.findIndex(o => o.label === d.label) !== i);
  const short = dataset.findIndex(d => d.texts.length < MIN);
  const [error, focusEl] =
    dataset.length < 2 ? ['클래스가 2개 이상 있어야 학습할 수 있어요.', document.getElementById('addClass')] :
    unnamed >= 0 ? ['이름이 비어 있는 클래스가 있어요.', cards[unnamed].querySelector('.cname')] :
    dup >= 0 ? ['클래스 이름이 서로 달라야 해요.', cards[dup].querySelector('.cname')] :
    short >= 0 ? [`'${dataset[short].label}' 클래스에 문장이 ${MIN - dataset[short].texts.length}개 더 필요해요.`,
      cards[short].querySelector('.cdata')] :
    [null, null];
  if (error) { focusEl.focus(); return showError(trainMsg, error); }

  trainMsg.textContent = '';
  model = train(dataset);
  go(3);
  playTraining(dataset);
});

// 문장에서 나온 조각이 클래스별 칸에 쌓이는 모습으로 "개수 세기"를 보여 준다
function playTraining(dataset) {
  const bar = document.getElementById('progressBar');
  const pct = document.getElementById('trainPct');
  const status = document.getElementById('status');
  const title = document.getElementById('trainTitle');
  const binsEl = document.getElementById('bins');

  title.textContent = '학습하는 중';
  binsEl.innerHTML = '';
  const bins = dataset.map((d, i) => {
    const bin = document.createElement('div');
    bin.className = 'bin';
    bin.style.setProperty('--cc', `var(--c${i % COLORS})`);
    bin.innerHTML = `<div class="bin-head"><span></span><span class="n">0</span></div><div class="bin-body"></div>`;
    bin.querySelector('.bin-head span').textContent = d.label;
    binsEl.appendChild(bin);
    const pieces = [...new Set(d.texts.flatMap(t => tokenize(t))
      .filter(t => t.startsWith('b:') || t.startsWith('w:')).map(t => t.slice(2)))];
    return {
      count: bin.querySelector('.n'), body: bin.querySelector('.bin-body'),
      total: model.classes[i].total,
      pieces: pieces.sort(() => Math.random() - .5).slice(0, 10), shown: 0,
    };
  });

  const messages = ['문장을 조각으로 나누는 중', '클래스별로 조각 개수를 세는 중', '확률을 계산하는 중'];
  const start = performance.now();

  function frame(now) {
    const t = Math.min((now - start) / TRAIN_MS, 1);
    const ease = 1 - Math.pow(1 - t, 2);
    bar.style.transform = `scaleX(${ease})`;
    pct.textContent = Math.round(ease * 100) + '%';
    status.textContent = messages[Math.min(Math.floor(t * messages.length), messages.length - 1)];

    for (const b of bins) {
      b.count.textContent = `조각 ${Math.round(ease * b.total)}개`;
      while (b.shown < Math.floor(t * b.pieces.length)) {
        const chip = document.createElement('span');
        chip.className = 'chip';
        chip.textContent = b.pieces[b.shown++];
        b.body.appendChild(chip);
      }
    }

    if (t < 1) return requestAnimationFrame(frame);
    title.textContent = '학습 완료';
    status.innerHTML = '<span class="train-done">테스트 화면으로 넘어갑니다.</span>';
    setTimeout(() => {
      document.getElementById('modelTag').textContent = modelNameEl.value.trim();
      document.getElementById('result').innerHTML = '';
      document.getElementById('testInput').value = '';
      go(4);
    }, 800);
  }
  requestAnimationFrame(frame);
}

// ----- 4단계: 테스트 -----
const resultEl = document.getElementById('result');
const testInput = document.getElementById('testInput');

function runTest() {
  const text = testInput.value.trim();
  if (!model) return;
  if (!text) { testInput.focus(); return; }
  const preds = predict(model, text);
  resultEl.innerHTML =
    `<p class="result-top">결과 <b style="--cc: var(--c${preds[0].color})">${escapeHtml(preds[0].label)}</b></p>` +
    preds.map(p => `
      <div class="bar-row" style="--cc: var(--c${p.color})">
        <div class="bar-label">${escapeHtml(p.label)}</div>
        <div class="bar"><span></span></div>
        <div class="pct">${(p.prob * 100).toFixed(1)}%</div>
      </div>`).join('') +
    `<p class="result-hint">“${escapeHtml(text)}”에 대한 클래스별 확률이에요.</p>`;
  requestAnimationFrame(() => requestAnimationFrame(() => {
    resultEl.querySelectorAll('.bar > span').forEach((el, i) => el.style.transform = `scaleX(${preds[i].prob})`);
  }));
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
}

document.getElementById('testBtn').addEventListener('click', runTest);
testInput.addEventListener('keydown', e => { if (e.key === 'Enter') runTest(); });
document.getElementById('backToData').addEventListener('click', () => go(2));
document.getElementById('restart').addEventListener('click', () => go(1));

go(1);
</script>
